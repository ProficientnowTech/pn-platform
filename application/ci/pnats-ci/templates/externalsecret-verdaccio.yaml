{{/*
  ExternalSecret: verdaccio-token
  Pulls npm-robot-username and npm-robot-password from Vault (originally synced
  there by PushSecret in the verdaccio namespace), then templates them into a
  base64-encoded "username:password" auth token for .npmrc consumption.

  The Verdaccio PushSecret (in the verdaccio namespace) seeds credentials into Vault.
  This ExternalSecret pulls them into the argo namespace for CI workflow use.

  Dependencies:
    - Vault path: applications/developer-platform/verdaccio/app
    - ClusterSecretStore: vault-backend
    - Consumed by: post-merge-build workflow (publish-to-verdaccio step)

  Notes:
    - Sync wave -5 ensures the secret exists before workflows reference it.
    - Uses ESO v2 template engine for the base64 encoding expression.
*/}}
{{- if .Values.verdaccio.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: verdaccio-token
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: {{ .Values.verdaccio.refreshInterval | default "1h" }}
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: verdaccio-token
    template:
      engineVersion: v2
      data:
        token: |-
          {{`{{ printf "%s:%s" .username .password | b64enc }}`}}
  data:
    - secretKey: username
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: {{ .Values.verdaccio.vaultPath }}
        metadataPolicy: None
        property: npm-robot-username
    - secretKey: password
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: {{ .Values.verdaccio.vaultPath }}
        metadataPolicy: None
        property: npm-robot-password
{{- end }}
