{{/*
  PushSecret: harbor-robot-credentials-push
  Syncs the Crossplane-generated Harbor robot account password to Vault.

  The Crossplane RobotAccount writes only the password to the K8s Secret
  (key: attribute.secret). The username is deterministic (robot$<name>).

  Dependencies:
    - Secret: harbor-robot-credentials (created by Crossplane RobotAccount)
    - ClusterSecretStore: vault-backend
*/}}
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: harbor-robot-credentials-push
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  secretStoreRefs:
    - name: vault-backend
      kind: ClusterSecretStore
  selector:
    secret:
      name: harbor-robot-credentials
  data:
    - match:
        secretKey: attribute.secret
        remoteRef:
          remoteKey: applications/developer-platform/harbor/robot
          property: password
