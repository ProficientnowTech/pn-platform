{{/*
  WorkflowTemplate: pr-validation
  PR validation pipeline triggered by the Sensor on PR opened/synchronize/reopened.

  Flow:
    1. ContainerSet (single pod, RWO PVC at /workspace):
       report-pending --> git-sync --> pnpm-install --> generate-dag
    2. Submits a dynamic child workflow with lint/test/build tasks
       (generated by tools/ci/generate-argo-dag.mjs based on nx affected)
    3. Reports success/failure commit status to GitHub

  The onExit handler (report-failure) ensures GitHub status is updated even on failure.

  Parameters (from Sensor):
    - head-sha:    commit SHA to validate
    - branch:      PR head branch name
    - pr-number:   pull request number
    - base-branch: target branch (for nx affected --base)

  Notes:
    - Mutex "ci-workspace" serializes runs — only one workflow at a time (RWO PVC).
    - Uses warm PVC strategy: first run does full clone, subsequent runs do fetch.

  Dependencies:
    - ServiceAccount: ci-workflow (sa-ci-workflow.yaml)
    - PVC: ci-workspace (pvc.yaml)
    - Secret: github-token (externalsecrets.yaml) — for clone and status API
    - Secret: nx-cache-server-token (nx-cache-server-token.yaml) — for Nx remote cache
    - Service: nx-cache-server (nx-cache-server-service.yaml) — Nx cache endpoint
*/}}
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: pr-validation
  namespace: argo
spec:
  arguments:
    parameters:
      - name: head-sha
      - name: branch
      - name: pr-number
      - name: base-branch
  entrypoint: validate
  onExit: report-failure
  serviceAccountName: ci-workflow
  synchronization:
    mutex:
      name: ci-workspace
  templates:
    # ──────────────────────────────────────────────────────────────────────
    # Entrypoint DAG — orchestrates ContainerSet → submit → report
    # ──────────────────────────────────────────────────────────────────────
    - name: validate
      dag:
        tasks:
          - name: prepare
            template: prepare-workspace
          - name: submit-child
            template: submit-task-workflow
            depends: prepare
            arguments:
              parameters:
                - name: workflow-spec
                  value: '{{`{{tasks.prepare.outputs.parameters.workflow-yaml}}`}}'
          - name: report-success
            template: github-status
            depends: submit-child
            arguments:
              parameters:
                - name: sha
                  value: '{{`{{workflow.parameters.head-sha}}`}}'
                - name: state
                  value: success
                - name: description
                  value: 'CI validation passed'

    # ──────────────────────────────────────────────────────────────────────
    # ContainerSet — single pod, RWO block PVC at /workspace
    # Runs: report-pending → git-sync → pnpm-install → generate-dag
    # ──────────────────────────────────────────────────────────────────────
    - name: prepare-workspace
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: ci-workspace
      outputs:
        parameters:
          - name: workflow-yaml
            valueFrom:
              path: /tmp/task-workflow.yaml
          - name: affected-apps
            valueFrom:
              path: /tmp/affected-apps.json
      containerSet:
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        containers:
          # ── 1. Report pending status to GitHub ──────────────────────────
          - name: report-pending
            image: {{ .Values.ciImage }}
            command: [sh, -c]
            args:
              - |
                curl -sf -X POST \
                  -H "Authorization: token ${GITHUB_TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d '{
                    "state": "pending",
                    "target_url": "https://argo.pnats.cloud/workflows/argo/{{`{{workflow.name}}`}}",
                    "description": "CI validation in progress",
                    "context": "argo-ci/validation"
                  }' \
                  "https://api.github.com/repos/{{ .Values.github.owner }}/{{ .Values.github.repo }}/statuses/{{`{{workflow.parameters.head-sha}}`}}"
            env:
              - name: GITHUB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: github-token
                    key: token

          # ── 2. Git clone / fetch (HTTPS + PAT) ─────────────────────────
          - name: git-sync
            image: {{ .Values.ciImage }}
            command: [sh, -c]
            args:
              - |
                cd /workspace
                if [ ! -d ".git" ]; then
                  echo "Cold PVC — full clone"
                  git clone https://x-access-token:${GITHUB_TOKEN}@github.com/{{ .Values.github.owner }}/{{ .Values.github.repo }}.git .
                else
                  echo "Warm PVC — fast fetch"
                  git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/{{ .Values.github.owner }}/{{ .Values.github.repo }}.git
                  git fetch origin --prune
                fi
                git checkout --force {{`{{workflow.parameters.head-sha}}`}}
                git clean -fd
            env:
              - name: GITHUB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: github-token
                    key: token

          # ── 3. pnpm install (cached on PVC, hard links on block) ───────
          - name: pnpm-install
            image: {{ .Values.ciImage }}
            command: [sh, -c]
            args:
              - cd /workspace && pnpm install --prefer-offline --frozen-lockfile
            dependencies:
              - git-sync
            resources:
              requests:
                cpu: '2'
                memory: 4Gi
              limits:
                cpu: '2'
                memory: 4Gi

          # ── 4. Generate Argo DAG (nx affected → child workflow YAML) ───
          - name: generate-dag
            image: {{ .Values.ciImage }}
            command: [node, --max-old-space-size=4096, /workspace/tools/ci/generate-argo-dag.mjs]
            dependencies:
              - pnpm-install
            env:
              - name: BASE_SHA
                value: 'origin/{{`{{workflow.parameters.base-branch}}`}}'
              - name: HEAD_SHA
                value: '{{`{{workflow.parameters.head-sha}}`}}'
              - name: TARGETS
                value: 'lint,test,build'
              - name: CI_IMAGE
                value: {{ .Values.ciImage | quote }}
              - name: WORKSPACE_PVC
                value: 'ci-workspace'
              - name: NAMESPACE
                value: {{ .Release.Namespace | quote }}
              - name: NX_SELF_HOSTED_REMOTE_CACHE_SERVER
                value: 'http://nx-cache-server.{{ .Release.Namespace }}.svc:3000'
              - name: NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: nx-cache-server-token
                    key: password
              - name: NX_CACHE_TOKEN_SECRET
                value: 'nx-cache-server-token'
            resources:
              requests:
                cpu: '2'
                memory: 4Gi
              limits:
                cpu: '2'
                memory: 4Gi

          # ── 5. Main container — gate for ContainerSet outputs ──────────
          - name: main
            image: {{ .Values.ciImage }}
            command: [sh, -c]
            args:
              - echo "ContainerSet complete"
            dependencies:
              - report-pending
              - generate-dag

    # ──────────────────────────────────────────────────────────────────────
    # Submit the generated child workflow and wait for completion
    # ──────────────────────────────────────────────────────────────────────
    - name: submit-task-workflow
      inputs:
        parameters:
          - name: workflow-spec
      resource:
        action: create
        successCondition: status.phase == Succeeded
        failureCondition: status.phase in (Failed, Error)
        manifest: '{{`{{inputs.parameters.workflow-spec}}`}}'

    # ──────────────────────────────────────────────────────────────────────
    # GitHub commit status helper
    # ──────────────────────────────────────────────────────────────────────
    - name: github-status
      inputs:
        parameters:
          - name: sha
          - name: state
          - name: description
      container:
        image: {{ .Values.ciImage }}
        command: [sh, -c]
        args:
          - |
            curl -sf -X POST \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{
                \"state\": \"{{`{{inputs.parameters.state}}`}}\",
                \"target_url\": \"https://argo.pnats.cloud/workflows/argo/{{`{{workflow.name}}`}}\",
                \"description\": \"{{`{{inputs.parameters.description}}`}}\",
                \"context\": \"argo-ci/validation\"
              }" \
              "https://api.github.com/repos/{{ .Values.github.owner }}/{{ .Values.github.repo }}/statuses/{{`{{inputs.parameters.sha}}`}}"
        env:
          - name: GITHUB_TOKEN
            valueFrom:
              secretKeyRef:
                name: github-token
                key: token

    # ──────────────────────────────────────────────────────────────────────
    # onExit: report failure to GitHub (only when workflow did not succeed)
    # ──────────────────────────────────────────────────────────────────────
    - name: report-failure
      container:
        image: {{ .Values.ciImage }}
        command: [sh, -c]
        args:
          - |
            if [ "{{`{{workflow.status}}`}}" != "Succeeded" ]; then
              curl -sf -X POST \
                -H "Authorization: token ${GITHUB_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "{
                  \"state\": \"failure\",
                  \"target_url\": \"https://argo.pnats.cloud/workflows/argo/{{`{{workflow.name}}`}}\",
                  \"description\": \"CI validation failed\",
                  \"context\": \"argo-ci/validation\"
                }" \
                "https://api.github.com/repos/{{ .Values.github.owner }}/{{ .Values.github.repo }}/statuses/{{`{{workflow.parameters.head-sha}}`}}"
            fi
        env:
          - name: GITHUB_TOKEN
            valueFrom:
              secretKeyRef:
                name: github-token
                key: token
