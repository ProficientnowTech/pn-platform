apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-cdc
  labels:
    app.kubernetes.io/name: audit-cdc
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: audit-cdc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit-cdc
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: audit-cdc
          image: registry.pnats.cloud/pnats/audit-cdc
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
