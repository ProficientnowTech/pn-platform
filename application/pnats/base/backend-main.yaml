apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-main
  labels:
    app.kubernetes.io/name: backend-main
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-main
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-main
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend-main
          image: registry.pnats.cloud/pnats/backend-main
          ports:
            - containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: backend-main
  labels:
    app.kubernetes.io/name: backend-main
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend-main
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
