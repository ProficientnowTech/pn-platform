apiVersion: apps/v1
kind: Deployment
metadata:
  name: boolgen-validator
  labels:
    app.kubernetes.io/name: boolgen-validator
    app.kubernetes.io/component: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: boolgen-validator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: boolgen-validator
        app.kubernetes.io/component: ai
    spec:
      containers:
        - name: boolgen-validator
          image: registry.pnats.cloud/pnats/boolgen-validator
          ports:
            - containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: boolgen-validator
  labels:
    app.kubernetes.io/name: boolgen-validator
    app.kubernetes.io/component: ai
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: boolgen-validator
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
