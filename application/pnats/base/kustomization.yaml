apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - harbor-pull-secret.yaml
  - api-gateway.yaml
  - auth-service.yaml
  - backend-main.yaml
  - integrations-service.yaml
  - mailer.yaml
  - web.yaml
  - pi-analysis.yaml
  - pi-scrape.yaml
  - pi-mailsum.yaml
  - boolgen-generator.yaml
  - boolgen-parser.yaml
  - boolgen-validator.yaml
  - boolgen-orchestrator.yaml
  - tasks.yaml
  - reminders.yaml
  - audit-api.yaml
  - audit-cdc.yaml
  - audit-timeline.yaml

patches:
  - target:
      kind: Deployment
    patch: |
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: harbor-pull-secret

commonLabels:
  app.kubernetes.io/part-of: pnats
