apiVersion: apps/v1
kind: Deployment
metadata:
  name: pi-scrape
  labels:
    app.kubernetes.io/name: pi-scrape
    app.kubernetes.io/component: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pi-scrape
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pi-scrape
        app.kubernetes.io/component: ai
    spec:
      containers:
        - name: pi-scrape
          image: registry.pnats.cloud/pnats/pi-scrape
          ports:
            - containerPort: 8245
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8245
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8245
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: pi-scrape
  labels:
    app.kubernetes.io/name: pi-scrape
    app.kubernetes.io/component: ai
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pi-scrape
  ports:
    - port: 8245
      targetPort: 8245
      protocol: TCP
