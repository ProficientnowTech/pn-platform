apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-timeline
  labels:
    app.kubernetes.io/name: audit-timeline
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: audit-timeline
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit-timeline
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: audit-timeline
          image: registry.pnats.cloud/pnats/audit-timeline
          ports:
            - containerPort: 8090
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: audit-timeline
  labels:
    app.kubernetes.io/name: audit-timeline
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: audit-timeline
  ports:
    - port: 8090
      targetPort: 8090
      protocol: TCP
