apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasks
  labels:
    app.kubernetes.io/name: tasks
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tasks
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tasks
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: tasks
          image: registry.pnats.cloud/pnats/tasks
          ports:
            - containerPort: 8060
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8060
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8060
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: tasks
  labels:
    app.kubernetes.io/name: tasks
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tasks
  ports:
    - port: 8060
      targetPort: 8060
      protocol: TCP
