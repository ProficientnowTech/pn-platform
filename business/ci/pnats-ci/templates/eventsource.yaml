{{/*
  EventSource: github-webhook
  Receives push and pull_request events from GitHub via webhook.

  Auto-creates the webhook on the configured repository using the GitHub API token.
  The webhook URL is exposed via Ingress (ingress.yaml) at ci-webhooks.pnats.cloud.

  Dependencies:
    - Secret: github-token (externalsecrets.yaml) — API token for webhook auto-creation
    - Secret: github-webhook-secret (externalsecrets.yaml) — shared HMAC secret for payload validation
    - Ingress: ci-webhooks (ingress.yaml) — exposes this EventSource to the internet
    - EventBus: default (eventbus.yaml) — events are published to this bus
*/}}
apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: github-webhook
  namespace: argo-events
spec:
  service:
    ports:
      - port: {{ .Values.github.webhookPort | int }}
        targetPort: {{ .Values.github.webhookPort | int }}
  github:
    pnow-ats-v2:
      repositories:
        - owner: {{ .Values.github.owner }}
          names:
            - {{ .Values.github.repo }}
      webhook:
        endpoint: {{ .Values.github.webhookEndpoint }}
        port: {{ .Values.github.webhookPort | quote }}
        method: POST
        url: {{ .Values.github.webhookUrl }}
      events:
        - pull_request
        - push
      apiToken:
        name: github-token
        key: token
      webhookSecret:
        name: github-webhook-secret
        key: secret
      contentType: json
      active: true
