{{/*
  ExternalSecret: harbor-docker-config
  Pulls Harbor robot account password from Vault and templates it into a
  dockerconfigjson secret with the deterministic username (robot$pnats+pnats-ci-robot).

  Dependencies:
    - Vault path: applications/developer-platform/harbor/robot (property: password)
      (synced by PushSecret from Crossplane-managed RobotAccount)
    - Consumed by: sa-ci-workflow.yaml (imagePullSecrets)
    - Consumed by: kaniko builds (docker push authentication)
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-docker-config
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-docker-config
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: |-
          {{`{{ printf "{\"auths\":{\"registry.pnats.cloud\":{\"auth\":\"%s\",\"username\":\"robot$pnats+pnats-ci-robot\",\"password\":\"%s\"}}}" (printf "robot$pnats+pnats-ci-robot:%s" .password | b64enc) .password }}`}}
  data:
    - secretKey: password
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: applications/developer-platform/harbor/robot
        metadataPolicy: None
        property: password
