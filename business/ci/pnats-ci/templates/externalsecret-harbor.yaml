{{/*
  ExternalSecret: harbor-docker-config
  Pulls Harbor robot account username and password from Vault (synced there
  by PushSecret from Crossplane-managed RobotAccount), then templates them
  into a dockerconfigjson secret for image pull/push authentication.

  Dependencies:
    - Vault path: applications/developer-platform/harbor/robot
      (synced by harbor-robot-push.yaml from Crossplane RobotAccount)
    - ClusterSecretStore: vault-backend
    - Consumed by: sa-ci-workflow.yaml (imagePullSecrets)
    - Consumed by: kaniko builds (docker push authentication)
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-docker-config
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-docker-config
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: |-
          {{`{{ printf "{\"auths\":{\"registry.pnats.cloud\":{\"auth\":\"%s\",\"username\":\"%s\",\"password\":\"%s\"}}}" (printf "%s:%s" .username .password | b64enc) .username .password }}`}}
  data:
    - secretKey: username
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: applications/developer-platform/harbor/robot
        metadataPolicy: None
        property: username
    - secretKey: password
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: applications/developer-platform/harbor/robot
        metadataPolicy: None
        property: password
