{{/*
  ExternalSecrets (generic, iterable)
  Iterates over .Values.secrets to create ExternalSecret resources that pull CI
  credentials from Vault via the ClusterSecretStore "vault-backend".

  Secrets managed by this template:
    - github-token          — GitHub PAT for clone and API access
    - github-webhook-secret — HMAC secret for webhook payload validation
    - harbor-docker-config  — Docker registry auth for Harbor (imagePullSecrets)
    - slack-webhook         — Slack incoming webhook URL for notifications

  Notes:
    - Sync wave -5 ensures secrets are created before resources that reference them.
    - Verdaccio and nx-cache-server tokens are handled by dedicated templates.
*/}}
{{- range $name, $secret := .Values.secrets }}
{{- if $secret.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secret.target }}
  {{- if $secret.namespace }}
  namespace: {{ $secret.namespace }}
  {{- end }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: {{ $secret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ $secret.target }}
    {{- if $secret.template }}
    template:
      type: {{ $secret.template.type }}
    {{- end }}
  data:
  {{- range $secret.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: {{ .remoteRef.key }}
        metadataPolicy: None
        property: {{ .remoteRef.property }}
  {{- end }}
{{- end }}
{{- end }}
