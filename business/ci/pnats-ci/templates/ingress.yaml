{{/*
  Ingress: ci-webhooks
  Exposes the GitHub webhook EventSource service at ci-webhooks.pnats.cloud.

  Routes external GitHub webhook traffic to the github-webhook-eventsource-svc
  (auto-created by Argo Events from the EventSource spec) in the argo-events namespace.

  TLS is managed by cert-manager via the letsencrypt-production ClusterIssuer.

  Dependencies:
    - EventSource: github-webhook (eventsource.yaml) — creates the backing service
    - cert-manager ClusterIssuer: letsencrypt-production — provisions TLS certificate
    - IngressClass: nginx
*/}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ci-webhooks
  namespace: argo-events
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - backend:
              service:
                name: github-webhook-eventsource-svc
                port:
                  number: {{ .Values.github.webhookPort | int }}
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: ci-webhooks-tls
{{- end }}
