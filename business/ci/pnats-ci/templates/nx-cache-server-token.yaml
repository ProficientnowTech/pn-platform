{{/*
  ExternalSecret: nx-cache-server-token
  Pulls the nx-cache-server auth token from Vault (ci/nx-cache-server).
  This is the Secret consumed by both the nx-cache-server Deployment and workflow pods.

  The token is manually bootstrapped in Vault once. This ExternalSecret keeps the
  K8s Secret in sync with Vault.

  Dependencies:
    - Vault path: ci/nx-cache-server (property: password)
    - Consumed by: nx-cache-server Deployment (nx-cache-server-deployment.yaml)
    - Consumed by: workflow-pr-validation.yaml and workflow-post-merge-build.yaml
*/}}
{{- if .Values.nxCacheServer.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nx-cache-server-token
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: nx-cache-server-token
  data:
    - secretKey: password
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: ci/nx-cache-server
        metadataPolicy: None
        property: password
{{- end }}
