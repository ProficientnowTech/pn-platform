{{/*
  AuthBackendRole: external-secrets-ci (Crossplane-managed Vault resource)
  Configures a Vault Kubernetes auth role that allows the external-secrets
  ServiceAccount to authenticate to Vault.

  This role grants the ESO operator access to CI secret paths via the
  eso-ci-secrets-policy, enabling it to read/write the nx-cache-server token
  and other CI credentials.

  Notes:
    - Sync wave -10 ensures Vault auth config exists before any ExternalSecrets.
    - Managed by Crossplane provider-vault (upbound), not applied directly.
    - Adds eso-ci-secrets-policy to the existing external-secrets role.

  Dependencies:
    - Vault policy: eso-ci-secrets-policy (vault-policy.yaml)
    - Crossplane ProviderConfig: vault-admin
    - Used by: all ExternalSecrets and PushSecrets in this chart
*/}}
apiVersion: kubernetes.vault.upbound.io/v1alpha1
kind: AuthBackendRole
metadata:
  name: external-secrets-ci
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  providerConfigRef:
    name: vault-admin
  forProvider:
    roleName: external-secrets
    backend: kubernetes
    boundServiceAccountNames:
      - external-secrets
    boundServiceAccountNamespaces:
      - external-secrets
    tokenPolicies:
      - external-secrets-policy
      - eso-ci-secrets-policy
    tokenTtl: 3600
