apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: rewrite-gcr-tekton-images
  annotations:
    policies.kyverno.io/title: Rewrite gcr.io Tekton images to ghcr.io
    policies.kyverno.io/description: >-
      The kubebb tekton-operator chart references gcr.io for EventListener
      sink images, but gcr.io has deprecated anonymous access (403).
      This policy rewrites gcr.io/tekton-releases/github.com/tektoncd/*
      to ghcr.io/tektoncd/* at pod admission time.
spec:
  rules:
    - name: rewrite-gcr-tekton-to-ghcr
      match:
        any:
          - resources:
              kinds:
                - Pod
      mutate:
        foreach:
          - list: "request.object.spec.containers"
            patchStrategicMerge:
              spec:
                containers:
                  - name: "{{ element.name }}"
                    image: "{{ regex_replace_all('gcr\\.io/tekton-releases/github\\.com/tektoncd/', element.image, 'ghcr.io/tektoncd/') }}"
