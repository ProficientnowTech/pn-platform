apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: pnats-ci
  namespace: tekton-pipelines
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/part-of: pnats-ci
spec:
  description: |
    CI pipeline for pnats monorepo. Triggered on PR merge.
    1. Clone source
    2. Detect changed services
    3. Publish npm packages to Verdaccio (changesets) — only if needed
    4. Build changed Docker images (Kaniko, parallel)
    5. Update image tags in infra repo (triggers ArgoCD)
  params:
    - name: git-url
      type: string
      default: git@github.com:ProficientnowTech/pnow-ats-v2.git
    - name: git-revision
      type: string
      default: develop
    - name: image-tag
      type: string
      description: Tag for Docker images (semver or sha)
    - name: target-environment
      type: string
      default: staging
    - name: create-release
      type: string
      default: "false"
    - name: npm-registry-auth
      type: string
      description: Base64 user:pass for Verdaccio registry
      default: ""
  workspaces:
    - name: shared-workspace
      description: Shared workspace for source code
    - name: ssh-credentials
      description: SSH key for git operations
    - name: docker-credentials
      description: Docker config for Harbor
    - name: npm-credentials
      description: npmrc for Verdaccio auth
    - name: github-token
      description: GitHub token for releases
  tasks:
    - name: clone
      taskRef:
        name: git-clone
      workspaces:
        - name: output
          workspace: shared-workspace
        - name: ssh-credentials
          workspace: ssh-credentials
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
    - name: detect-changes
      taskRef:
        name: detect-changes
      runAfter: ["clone"]
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: ssh-credentials
          workspace: ssh-credentials
    - name: build-shared-libs
      when:
        - input: $(tasks.detect-changes.results.publish-packages)
          operator: in
          values: ["true"]
      taskRef:
        name: build-shared-libs
      runAfter: ["detect-changes"]
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: npm-credentials
          workspace: npm-credentials
      params:
        - name: registry-url
          value: https://npm.pnats.cloud
    - name: release-packages
      taskRef:
        name: release-packages
      runAfter: ["build-shared-libs"]
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: npm-credentials
          workspace: npm-credentials
        - name: github-token
          workspace: github-token
    - name: git-push-release
      taskRef:
        name: git-push-release
      runAfter: ["release-packages"]
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: ssh-credentials
          workspace: ssh-credentials
    - name: build-api-gateway
      when:
        - input: $(tasks.detect-changes.results.api-gateway)
          operator: in
          values: ["true"]
      taskRef:
        name: kaniko-build
      runAfter: ["git-push-release"]
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: image
          value: registry.pnats.cloud/pnats/api-gateway
        - name: tag
          value: $(params.image-tag)
        - name: dockerfile
          value: docker/Dockerfile
        - name: build-args
          value:
            - "--build-arg=APP_NAME=api-gateway"
            - "--build-arg=REGISTRY=registry.pnats.cloud/pnats/base"
            - "--build-arg=NPM_REGISTRY_URL=https://npm.pnats.cloud"
            - "--build-arg=NPM_REGISTRY_AUTH=$(params.npm-registry-auth)"
    - name: build-auth-service
      when:
        - input: $(tasks.detect-changes.results.auth-service)
          operator: in
          values: ["true"]
      taskRef:
        name: kaniko-build
      runAfter: ["git-push-release"]
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: image
          value: registry.pnats.cloud/pnats/auth-service
        - name: tag
          value: $(params.image-tag)
        - name: dockerfile
          value: docker/Dockerfile
        - name: build-args
          value:
            - "--build-arg=APP_NAME=auth-service"
            - "--build-arg=REGISTRY=registry.pnats.cloud/pnats/base"
            - "--build-arg=NPM_REGISTRY_URL=https://npm.pnats.cloud"
            - "--build-arg=NPM_REGISTRY_AUTH=$(params.npm-registry-auth)"
    - name: build-backend-main
      when:
        - input: $(tasks.detect-changes.results.backend-main)
          operator: in
          values: ["true"]
      taskRef:
        name: kaniko-build
      runAfter: ["git-push-release"]
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: image
          value: registry.pnats.cloud/pnats/backend-main
        - name: tag
          value: $(params.image-tag)
        - name: dockerfile
          value: docker/Dockerfile
        - name: build-args
          value:
            - "--build-arg=APP_NAME=backend-main"
            - "--build-arg=REGISTRY=registry.pnats.cloud/pnats/base"
            - "--build-arg=NPM_REGISTRY_URL=https://npm.pnats.cloud"
            - "--build-arg=NPM_REGISTRY_AUTH=$(params.npm-registry-auth)"
    - name: build-integrations-service
      when:
        - input: $(tasks.detect-changes.results.integrations-service)
          operator: in
          values: ["true"]
      taskRef:
        name: kaniko-build
      runAfter: ["git-push-release"]
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: image
          value: registry.pnats.cloud/pnats/integrations-service
        - name: tag
          value: $(params.image-tag)
        - name: dockerfile
          value: docker/Dockerfile
        - name: build-args
          value:
            - "--build-arg=APP_NAME=integrations-service"
            - "--build-arg=REGISTRY=registry.pnats.cloud/pnats/base"
            - "--build-arg=NPM_REGISTRY_URL=https://npm.pnats.cloud"
            - "--build-arg=NPM_REGISTRY_AUTH=$(params.npm-registry-auth)"
    - name: build-mailer
      when:
        - input: $(tasks.detect-changes.results.mailer)
          operator: in
          values: ["true"]
      taskRef:
        name: kaniko-build
      runAfter: ["git-push-release"]
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: image
          value: registry.pnats.cloud/pnats/mailer
        - name: tag
          value: $(params.image-tag)
        - name: dockerfile
          value: docker/Dockerfile
        - name: build-args
          value:
            - "--build-arg=APP_NAME=mailer"
            - "--build-arg=REGISTRY=registry.pnats.cloud/pnats/base"
            - "--build-arg=NPM_REGISTRY_URL=https://npm.pnats.cloud"
            - "--build-arg=NPM_REGISTRY_AUTH=$(params.npm-registry-auth)"
    - name: build-web
      when:
        - input: $(tasks.detect-changes.results.web)
          operator: in
          values: ["true"]
      taskRef:
        name: kaniko-build
      runAfter: ["git-push-release"]
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: image
          value: registry.pnats.cloud/pnats/web
        - name: tag
          value: $(params.image-tag)
        - name: dockerfile
          value: docker/Dockerfile.frontend
        - name: build-args
          value:
            - "--build-arg=REGISTRY=registry.pnats.cloud/pnats/base"
            - "--build-arg=NPM_REGISTRY_URL=https://npm.pnats.cloud"
            - "--build-arg=NPM_REGISTRY_AUTH=$(params.npm-registry-auth)"
    - name: build-pi-analysis
      when:
        - input: $(tasks.detect-changes.results.pi-analysis)
          operator: in
          values: ["true"]
      taskRef:
        name: kaniko-build
      runAfter: ["detect-changes"]
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: image
          value: registry.pnats.cloud/pnats/pi-analysis
        - name: tag
          value: $(params.image-tag)
        - name: dockerfile
          value: docker/Dockerfile.pi-analysis
        - name: build-args
          value:
            - "--build-arg=REGISTRY=registry.pnats.cloud/pnats/base"
    - name: build-pi-scrape
      when:
        - input: $(tasks.detect-changes.results.pi-scrape)
          operator: in
          values: ["true"]
      taskRef:
        name: kaniko-build
      runAfter: ["detect-changes"]
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: image
          value: registry.pnats.cloud/pnats/pi-scrape
        - name: tag
          value: $(params.image-tag)
        - name: dockerfile
          value: docker/Dockerfile.python
        - name: build-args
          value:
            - "--build-arg=SERVICE_DIR=apps/backend/pi-scrape"
            - "--build-arg=BUILD_DEPS=build-essential python3-dev libffi-dev libssl-dev pkg-config librdkafka-dev"
            - "--build-arg=RUNTIME_DEPS=librdkafka1"
    - name: build-pi-mailsum
      when:
        - input: $(tasks.detect-changes.results.pi-mailsum)
          operator: in
          values: ["true"]
      taskRef:
        name: kaniko-build
      runAfter: ["detect-changes"]
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: image
          value: registry.pnats.cloud/pnats/pi-mailsum
        - name: tag
          value: $(params.image-tag)
        - name: dockerfile
          value: docker/Dockerfile.python
        - name: build-args
          value:
            - "--build-arg=SERVICE_DIR=apps/backend/pi-mailsum"
            - "--build-arg=BUILD_DEPS=build-essential python3-dev libffi-dev libssl-dev pkg-config librdkafka-dev"
            - "--build-arg=RUNTIME_DEPS=librdkafka1"
    - name: build-boolgen-generator
      when:
        - input: $(tasks.detect-changes.results.boolgen-generator)
          operator: in
          values: ["true"]
      taskRef:
        name: kaniko-build
      runAfter: ["detect-changes"]
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: image
          value: registry.pnats.cloud/pnats/boolgen-generator
        - name: tag
          value: $(params.image-tag)
        - name: dockerfile
          value: docker/Dockerfile.python
        - name: build-args
          value: ["--build-arg=SERVICE_DIR=apps/backend/pi-boolgen/services/generator"]
    - name: build-boolgen-parser
      when:
        - input: $(tasks.detect-changes.results.boolgen-parser)
          operator: in
          values: ["true"]
      taskRef:
        name: kaniko-build
      runAfter: ["detect-changes"]
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: image
          value: registry.pnats.cloud/pnats/boolgen-parser
        - name: tag
          value: $(params.image-tag)
        - name: dockerfile
          value: docker/Dockerfile.python
        - name: build-args
          value: ["--build-arg=SERVICE_DIR=apps/backend/pi-boolgen/services/parser"]
    - name: build-boolgen-validator
      when:
        - input: $(tasks.detect-changes.results.boolgen-validator)
          operator: in
          values: ["true"]
      taskRef:
        name: kaniko-build
      runAfter: ["detect-changes"]
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: image
          value: registry.pnats.cloud/pnats/boolgen-validator
        - name: tag
          value: $(params.image-tag)
        - name: dockerfile
          value: docker/Dockerfile.python
        - name: build-args
          value: ["--build-arg=SERVICE_DIR=apps/backend/pi-boolgen/services/validator"]
    - name: build-boolgen-orchestrator
      when:
        - input: $(tasks.detect-changes.results.boolgen-orchestrator)
          operator: in
          values: ["true"]
      taskRef:
        name: kaniko-build
      runAfter: ["detect-changes"]
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: image
          value: registry.pnats.cloud/pnats/boolgen-orchestrator
        - name: tag
          value: $(params.image-tag)
        - name: dockerfile
          value: docker/Dockerfile.python
        - name: build-args
          value: ["--build-arg=SERVICE_DIR=apps/backend/pi-boolgen/services/orchestrator"]
    - name: build-tasks
      when:
        - input: $(tasks.detect-changes.results.tasks)
          operator: in
          values: ["true"]
      taskRef:
        name: kaniko-build
      runAfter: ["detect-changes"]
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: image
          value: registry.pnats.cloud/pnats/tasks
        - name: tag
          value: $(params.image-tag)
        - name: dockerfile
          value: docker/Dockerfile.python
        - name: build-args
          value:
            - "--build-arg=SERVICE_DIR=apps/backend/tasks-reminders/tasks"
            - "--build-arg=BUILD_DEPS=build-essential libpq-dev"
            - "--build-arg=RUNTIME_DEPS=libpq5"
    - name: build-reminders
      when:
        - input: $(tasks.detect-changes.results.reminders)
          operator: in
          values: ["true"]
      taskRef:
        name: kaniko-build
      runAfter: ["detect-changes"]
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: image
          value: registry.pnats.cloud/pnats/reminders
        - name: tag
          value: $(params.image-tag)
        - name: dockerfile
          value: docker/Dockerfile.python
        - name: build-args
          value:
            - "--build-arg=SERVICE_DIR=apps/backend/tasks-reminders/reminders"
            - "--build-arg=BUILD_DEPS=build-essential libpq-dev"
            - "--build-arg=RUNTIME_DEPS=libpq5"
    - name: build-audit-timeline
      when:
        - input: $(tasks.detect-changes.results.audit-timeline)
          operator: in
          values: ["true"]
      taskRef:
        name: kaniko-build
      runAfter: ["detect-changes"]
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: image
          value: registry.pnats.cloud/pnats/audit-timeline
        - name: tag
          value: $(params.image-tag)
        - name: dockerfile
          value: docker/Dockerfile.python
        - name: build-args
          value: ["--build-arg=SERVICE_DIR=apps/backend/audit-service/activity-timeline-service"]
    - name: build-audit-api
      when:
        - input: $(tasks.detect-changes.results.audit-api)
          operator: in
          values: ["true"]
      taskRef:
        name: kaniko-build
      runAfter: ["detect-changes"]
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: image
          value: registry.pnats.cloud/pnats/audit-api
        - name: tag
          value: $(params.image-tag)
        - name: dockerfile
          value: docker/Dockerfile.python
        - name: build-args
          value: ["--build-arg=SERVICE_DIR=apps/backend/audit-service/api-service"]
    - name: build-audit-cdc
      when:
        - input: $(tasks.detect-changes.results.audit-cdc)
          operator: in
          values: ["true"]
      taskRef:
        name: kaniko-build
      runAfter: ["detect-changes"]
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: image
          value: registry.pnats.cloud/pnats/audit-cdc
        - name: tag
          value: $(params.image-tag)
        - name: dockerfile
          value: docker/Dockerfile.python
        - name: build-args
          value:
            - "--build-arg=SERVICE_DIR=apps/backend/audit-service/cdc-service"
            - "--build-arg=BUILD_DEPS=build-essential python3-dev librdkafka-dev"
            - "--build-arg=RUNTIME_DEPS=librdkafka1"
    - name: update-tags
      taskRef:
        name: update-image-tag
      runAfter:
        - build-api-gateway
        - build-auth-service
        - build-backend-main
        - build-integrations-service
        - build-mailer
        - build-web
        - build-pi-analysis
        - build-pi-scrape
        - build-pi-mailsum
        - build-boolgen-generator
        - build-boolgen-parser
        - build-boolgen-validator
        - build-boolgen-orchestrator
        - build-tasks
        - build-reminders
        - build-audit-timeline
        - build-audit-api
        - build-audit-cdc
      workspaces:
        - name: output
          workspace: shared-workspace
        - name: ssh-credentials
          workspace: ssh-credentials
      params:
        - name: image-tag
          value: $(params.image-tag)
        - name: environment
          value: $(params.target-environment)
  finally:
    - name: create-github-release
      when:
        - input: $(params.create-release)
          operator: in
          values: ["true"]
      taskRef:
        name: github-release
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: github-token
          workspace: github-token
      params:
        - name: tag
          value: v$(params.image-tag)
        - name: repo
          value: ProficientnowTech/pnow-ats-v2
