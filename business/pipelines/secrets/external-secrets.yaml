# GitHub SSH key for cloning private repos
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: github-ssh-key
  namespace: tekton-pipelines
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: github-ssh-key
  data:
    - secretKey: ssh-privatekey
      remoteRef:
        key: secret/data/pnats/github
        property: ssh-private-key
    - secretKey: known_hosts
      remoteRef:
        key: secret/data/pnats/github
        property: known-hosts
---
# Harbor registry credentials for Kaniko push
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-registry-credentials
  namespace: tekton-pipelines
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-registry-credentials
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "registry.pnats.cloud": {
                "username": "{{ .username }}",
                "password": "{{ .password }}",
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/pnats/harbor
        property: robot-username
    - secretKey: password
      remoteRef:
        key: secret/data/pnats/harbor
        property: robot-password
---
