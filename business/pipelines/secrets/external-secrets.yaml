# GitHub SSH key for cloning private repos
# Vault path: applications/business/pnats/github (new — must be provisioned)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-ssh-key
  namespace: tekton-pipelines
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: github-ssh-key
    template:
      data:
        ssh-privatekey: "{{ .sshkey }}\n"
        known_hosts: "{{ .knownhosts }}\n"
  data:
    - secretKey: sshkey
      remoteRef:
        key: applications/business/pnats/github
        property: ssh-private-key
    - secretKey: knownhosts
      remoteRef:
        key: applications/business/pnats/github
        property: known-hosts
---
# Harbor registry credentials for Kaniko push
# Robot account created by Crossplane provider-harbor (pn-infra#22)
# Username follows Harbor system-level convention: robot$<name>
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-registry-credentials
  namespace: tekton-pipelines
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-registry-credentials
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "registry.pnats.cloud": {
                "username": "robot$pnats-ci-robot",
                "password": "{{ .password }}",
                "auth": "{{ printf "robot$pnats-ci-robot:%s" .password | b64enc }}"
              }
            }
          }
  data:
    - secretKey: password
      remoteRef:
        key: applications/developer-platform/harbor/robot
        property: password
---
# Verdaccio credentials for npm publish
# Pulls npm robot credentials from existing Verdaccio Vault path
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: verdaccio-credentials
  namespace: tekton-pipelines
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: verdaccio-credentials
    template:
      data:
        .npmrc: |
          @pnats:registry=https://npm.pnats.cloud
          //npm.pnats.cloud/:_authToken={{ .token }}
  data:
    - secretKey: token
      remoteRef:
        key: applications/developer-platform/verdaccio/app
        property: npm-robot-password
---
# GitHub token for releases
# Vault path: applications/business/pnats/github (new — must be provisioned)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
