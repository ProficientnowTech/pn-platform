apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: detect-changes
  namespace: tekton-pipelines
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/part-of: pnats-ci
spec:
  description: |
    Uses `nx affected` to detect which services changed.
    Outputs per-service booleans for pipeline when expressions.
  params:
    - name: base-branch
      type: string
      default: develop
  workspaces:
    - name: source
      description: Cloned source repo
    - name: ssh-credentials
      description: SSH key for git fetch
      optional: true
  results:
    - { name: api-gateway, type: string }
    - { name: auth-service, type: string }
    - { name: backend-main, type: string }
    - { name: integrations-service, type: string }
    - { name: mailer, type: string }
    - { name: web, type: string }
    - { name: pi-analysis, type: string }
    - { name: pi-scrape, type: string }
    - { name: pi-mailsum, type: string }
    - { name: boolgen-generator, type: string }
    - { name: boolgen-parser, type: string }
    - { name: boolgen-validator, type: string }
    - { name: boolgen-orchestrator, type: string }
    - { name: tasks, type: string }
    - { name: reminders, type: string }
    - { name: audit-api, type: string }
    - { name: audit-timeline, type: string }
    - { name: audit-cdc, type: string }
    - { name: publish-packages, type: string }
  steps:
    - name: detect
      image: node:24-alpine
      script: |
        #!/usr/bin/env sh
        set -eu

        apk add --no-cache git openssh > /dev/null 2>&1

        # SSH setup for git fetch
        if [ -d "$(workspaces.ssh-credentials.path)" ] 2>/dev/null; then
          mkdir -p /root/.ssh && chmod 700 /root/.ssh
          cp "$(workspaces.ssh-credentials.path)/ssh-privatekey" /root/.ssh/id_rsa
          chmod 400 /root/.ssh/id_rsa
          [ -f "$(workspaces.ssh-credentials.path)/known_hosts" ] && \
            cp "$(workspaces.ssh-credentials.path)/known_hosts" /root/.ssh/known_hosts
          ssh-keyscan github.com >> /root/.ssh/known_hosts 2>/dev/null
        fi

        cd "$(workspaces.source.path)"

        # Install only nx (not the full monorepo) — just enough to resolve the project graph
        npm install --no-save nx@21 @nx/devkit@21 > /dev/null 2>&1

        # Fetch base branch for nx affected comparison
        git fetch origin "$(params.base-branch)" --depth=1 2>/dev/null || true

        # Get affected projects from Nx
        AFFECTED=$(npx nx show projects --affected \
          --base="origin/$(params.base-branch)" --head=HEAD \
          --type=app 2>/dev/null || echo "FALLBACK")

        if [ "$AFFECTED" = "FALLBACK" ]; then
          echo "WARNING: nx affected failed — rebuilding everything"
        fi

        echo "Affected projects:"
        echo "$AFFECTED"
        echo "---"

        # Check if a project is affected and write result
        # Note: Tekton interpolates $(results.X.path) at template time,
        # so each result must be written explicitly (not via shell variable)
        is_affected() { [ "$AFFECTED" = "FALLBACK" ] || echo "$AFFECTED" | grep -q "$1"; }

        if is_affected "@pnats/api-gateway"; then printf true > $(results.api-gateway.path); echo "  api-gateway: true"; else printf false > $(results.api-gateway.path); fi
        if is_affected "@pnats/auth-service"; then printf true > $(results.auth-service.path); echo "  auth-service: true"; else printf false > $(results.auth-service.path); fi
        if is_affected "@pnats/backend-main"; then printf true > $(results.backend-main.path); echo "  backend-main: true"; else printf false > $(results.backend-main.path); fi
        if is_affected "@pnats/integrations-service"; then printf true > $(results.integrations-service.path); echo "  integrations-service: true"; else printf false > $(results.integrations-service.path); fi
        if is_affected "@pnats/mailer"; then printf true > $(results.mailer.path); echo "  mailer: true"; else printf false > $(results.mailer.path); fi
        if is_affected "@pnats/web"; then printf true > $(results.web.path); echo "  web: true"; else printf false > $(results.web.path); fi
        if is_affected "@pnats/pi-analysis"; then printf true > $(results.pi-analysis.path); echo "  pi-analysis: true"; else printf false > $(results.pi-analysis.path); fi
        if is_affected "@pnats/pi-scrape"; then printf true > $(results.pi-scrape.path); echo "  pi-scrape: true"; else printf false > $(results.pi-scrape.path); fi
        if is_affected "@pnats/pi-mailsum"; then printf true > $(results.pi-mailsum.path); echo "  pi-mailsum: true"; else printf false > $(results.pi-mailsum.path); fi
        if is_affected "@pnats/pi-boolgen-generator"; then printf true > $(results.boolgen-generator.path); echo "  boolgen-generator: true"; else printf false > $(results.boolgen-generator.path); fi
        if is_affected "@pnats/pi-boolgen-parser"; then printf true > $(results.boolgen-parser.path); echo "  boolgen-parser: true"; else printf false > $(results.boolgen-parser.path); fi
        if is_affected "@pnats/pi-boolgen-validator"; then printf true > $(results.boolgen-validator.path); echo "  boolgen-validator: true"; else printf false > $(results.boolgen-validator.path); fi
        if is_affected "@pnats/pi-boolgen-orchestrator"; then printf true > $(results.boolgen-orchestrator.path); echo "  boolgen-orchestrator: true"; else printf false > $(results.boolgen-orchestrator.path); fi
        if is_affected "@pnats/tasks"; then printf true > $(results.tasks.path); echo "  tasks: true"; else printf false > $(results.tasks.path); fi
        if is_affected "@pnats/reminders"; then printf true > $(results.reminders.path); echo "  reminders: true"; else printf false > $(results.reminders.path); fi
        if is_affected "@pnats/audit-api-service"; then printf true > $(results.audit-api.path); echo "  audit-api: true"; else printf false > $(results.audit-api.path); fi
        if is_affected "@pnats/audit-activity-timeline-service"; then printf true > $(results.audit-timeline.path); echo "  audit-timeline: true"; else printf false > $(results.audit-timeline.path); fi
        if is_affected "@pnats/audit-cdc-service"; then printf true > $(results.audit-cdc.path); echo "  audit-cdc: true"; else printf false > $(results.audit-cdc.path); fi

        # publish-packages: true if any shared lib is affected
        LIBS=$(npx nx show projects --affected \
          --base="origin/$(params.base-branch)" --head=HEAD \
          --type=lib 2>/dev/null || echo "FALLBACK")
        if [ "$LIBS" = "FALLBACK" ] || [ -n "$LIBS" ]; then
          printf true > $(results.publish-packages.path)
          echo "  publish-packages: true"
        else
          printf false > $(results.publish-packages.path)
        fi
