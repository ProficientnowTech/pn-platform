apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: npm-publish
  namespace: tekton-pipelines
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/part-of: pnats-ci
spec:
  description: |
    Runs changeset version + publish to Verdaccio.
    Publishes Layer 0 packages first (no deps), then Layer 1 (with deps).
  params:
    - name: registry-url
      type: string
      default: https://npm.pnats.cloud
      description: Verdaccio registry URL
  workspaces:
    - name: source
      description: Source code with packages
    - name: npm-credentials
      description: Workspace containing .npmrc with auth token
    - name: github-token
      description: GitHub token for changelog generation
      optional: true
    - name: ssh-credentials
      description: SSH key for git push
      optional: true
  steps:
    - name: configure-registry
      image: node:24-alpine
      env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: nx-cache
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: nx-cache
              key: AWS_SECRET_ACCESS_KEY
        - name: NX_CACHE_S3_BUCKET
          valueFrom:
            configMapKeyRef:
              name: nx-cache
              key: BUCKET_NAME
        - name: NX_CACHE_S3_ENDPOINT
          value: "http://rook-ceph-rgw-app-objectstore.ceph-cluster.svc:80"
      script: |
        #!/usr/bin/env sh
        set -eu

        cd "$(workspaces.source.path)"

        # Copy npmrc with auth token
        if [ -f "$(workspaces.npm-credentials.path)/.npmrc" ]; then
          cp "$(workspaces.npm-credentials.path)/.npmrc" .npmrc
        fi

        # Install pnpm
        corepack enable && corepack prepare pnpm@9.15.4 --activate

        # Install dependencies
        pnpm install --frozen-lockfile

    - name: version-and-publish
      image: node:24-alpine
      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-token
              key: token
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: nx-cache
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: nx-cache
              key: AWS_SECRET_ACCESS_KEY
        - name: NX_CACHE_S3_BUCKET
          valueFrom:
            configMapKeyRef:
              name: nx-cache
              key: BUCKET_NAME
        - name: NX_CACHE_S3_ENDPOINT
          value: "http://rook-ceph-rgw-app-objectstore.ceph-cluster.svc:80"
      script: |
        #!/usr/bin/env sh
        set -eu

        apk add --no-cache git openssh

        cd "$(workspaces.source.path)"
        corepack enable && corepack prepare pnpm@9.15.4 --activate

        # Check if there are pending changesets
        if [ -z "$(ls .changeset/*.md 2>/dev/null | grep -v README)" ]; then
          echo "No pending changesets, skipping publish"
          exit 0
        fi

        # Apply changeset versions
        pnpm changeset version

        # Build all packages
        pnpm --recursive --filter './shared/*' --filter './plugins/*' run build

        # Publish to Verdaccio
        pnpm changeset publish

        # Setup SSH for git push
        if [ -d "$(workspaces.ssh-credentials.path)" ] 2>/dev/null; then
          mkdir -p /root/.ssh
          chmod 700 /root/.ssh
          cp "$(workspaces.ssh-credentials.path)/ssh-privatekey" /root/.ssh/id_rsa
          chmod 400 /root/.ssh/id_rsa
          if [ -f "$(workspaces.ssh-credentials.path)/known_hosts" ]; then
            cp "$(workspaces.ssh-credentials.path)/known_hosts" /root/.ssh/known_hosts
          fi
          ssh-keyscan github.com >> /root/.ssh/known_hosts 2>/dev/null
        fi

        git config user.email "tekton@pnats.cloud"
        git config user.name "Tekton CI"
        # Only stage changeset version bumps — git add -A is too slow (scans node_modules)
        git add .changeset/ '**/package.json' '**/CHANGELOG.md' pnpm-lock.yaml
        if ! git diff --cached --quiet; then
          git commit -m "chore: version packages"
          git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)" || true
          git push origin HEAD
        fi

        echo "Packages published successfully"
