apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: npm-publish
  namespace: tekton-pipelines
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/part-of: pnats-ci
spec:
  description: |
    Versions and publishes shared packages to Verdaccio using Nx Release.
    Uses conventional commits for automatic version bumps.
  params:
    - name: registry-url
      type: string
      default: https://npm.pnats.cloud
      description: Verdaccio registry URL
  workspaces:
    - name: source
      description: Source code with packages
    - name: npm-credentials
      description: Workspace containing .npmrc with auth token
    - name: github-token
      description: GitHub token for releases
      optional: true
    - name: ssh-credentials
      description: SSH key for git push
      optional: true
  steps:
    - name: install
      image: node:24-alpine
      env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: nx-cache
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: nx-cache
              key: AWS_SECRET_ACCESS_KEY
        - name: NX_CACHE_S3_BUCKET
          valueFrom:
            configMapKeyRef:
              name: nx-cache
              key: BUCKET_NAME
        - name: NX_CACHE_S3_ENDPOINT
          value: "http://rook-ceph-rgw-app-objectstore.ceph-cluster.svc:80"
      script: |
        #!/usr/bin/env sh
        set -eu

        cd "$(workspaces.source.path)"

        if [ -f "$(workspaces.npm-credentials.path)/.npmrc" ]; then
          cp "$(workspaces.npm-credentials.path)/.npmrc" .npmrc
        fi

        corepack enable && corepack prepare pnpm@9.15.4 --activate
        pnpm install --frozen-lockfile

    - name: release
      image: node:24-alpine
      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-token
              key: token
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: nx-cache
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: nx-cache
              key: AWS_SECRET_ACCESS_KEY
        - name: NX_CACHE_S3_BUCKET
          valueFrom:
            configMapKeyRef:
              name: nx-cache
              key: BUCKET_NAME
        - name: NX_CACHE_S3_ENDPOINT
          value: "http://rook-ceph-rgw-app-objectstore.ceph-cluster.svc:80"
      script: |
        #!/usr/bin/env sh
        set -eu

        apk add --no-cache git openssh

        cd "$(workspaces.source.path)"
        corepack enable && corepack prepare pnpm@9.15.4 --activate

        # SSH setup for git push
        if [ -d "$(workspaces.ssh-credentials.path)" ] 2>/dev/null; then
          mkdir -p /root/.ssh && chmod 700 /root/.ssh
          cp "$(workspaces.ssh-credentials.path)/ssh-privatekey" /root/.ssh/id_rsa
          chmod 400 /root/.ssh/id_rsa
          [ -f "$(workspaces.ssh-credentials.path)/known_hosts" ] && \
            cp "$(workspaces.ssh-credentials.path)/known_hosts" /root/.ssh/known_hosts
          ssh-keyscan github.com >> /root/.ssh/known_hosts 2>/dev/null
        fi

        git config user.email "tekton@pnats.cloud"
        git config user.name "Tekton CI"

        # Build shared packages
        pnpm --recursive --filter './shared/*' --filter './plugins/*' run build

        # Version + changelog (conventional commits, skip publish)
        npx nx release version --skip-publish --yes || {
          echo "No version changes detected — skipping publish"
          exit 0
        }

        # Publish to Verdaccio
        npx nx release publish --yes

        # Push version commits + tags back to repo
        git add '**/package.json' '**/CHANGELOG.md'
        if ! git diff --cached --quiet; then
          git commit -m "chore(release): version packages"
          git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)" || true
          git push origin HEAD
          git push origin --tags
        fi

        echo "Release complete"
