apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: proxmox-cloud-config, namespace: csi-proxmox }
spec:
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target:
    template:
      data:
        config.yaml: |
          clusters:
            - url: ${PVE_API_URL}
              token_id: "kubernetes-csi@pve!csi"
              token_secret: "{{ .csitoken }}"
              region: ${PVE_REGION}
  data: [{ secretKey: csitoken, remoteRef: { key: pve-csi-token-secret } }]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: argocd-github-app-creds, namespace: argocd }
spec:
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target: { name: argocd-github-app-creds }
  data:
    - { secretKey: appID,      remoteRef: { key: onprem-argocd-github-app-id } }
    - { secretKey: installID,  remoteRef: { key: onprem-argocd-github-installation-id } }
    - { secretKey: privateKey, remoteRef: { key: onprem-argocd-github-privatekey } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: cloudflare-api-token, namespace: cert-manager }
spec:
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target: { name: cloudflare-api-token }
  data: [{ secretKey: api-token, remoteRef: { key: cloudflare-api-token } }]
