{{- if .Values.tsLayer }}
apiVersion: v1
kind: ConfigMap
metadata: {name: sw}
data: {wave: {{ include "app-factory.syncwave" (dict "layer" .Values.tsLayer "order" .Values.tsOrder) | quote }}}
{{- end }}
{{- if .Values.vApp }}
{{- $vArgs := dict "app" .Values.vApp "cluster" .Values.vCluster "environment" .Values.vEnv "teams" (list "platform" "data") "index" .Values.vIndex -}}
{{- /* orderIndex is only added to the args when the test explicitly sets it, so the "no
     orderIndex passed" fallback path (today's behaviour, for a consumer that hasn't been
     updated) stays reachable in tests. A key present-but-nil would defeat `hasKey`. */ -}}
{{- if .Values.vOrderIndex -}}{{- $_ := set $vArgs "orderIndex" .Values.vOrderIndex -}}{{- end -}}
{{ include "app-factory.validate" $vArgs }}
{{- end }}
{{- if .Values.lApp }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: lbl
  labels:
    {{- include "app-factory.labels" (dict "app" .Values.lApp "cluster" "onprem-primary" "environment" "prod") | nindent 4 }}
{{- end }}
{{- if .Values.aApp }}
{{ include "app-factory.application" (dict "app" .Values.aApp "cluster" "onprem-primary" "environment" "prod" "destination" (dict "name" "in-cluster" "namespace" "harbor")) }}
{{- end }}
{{- if .Values.pDomain }}
{{ include "app-factory.appproject" (dict "domain" .Values.pDomain "destinations" (list (dict "name" "in-cluster" "namespace" "*")) "clusterResources" (.Values.pClusterResources | default list) "namespaceResources" .Values.pNamespaceResources) }}
{{- end }}
