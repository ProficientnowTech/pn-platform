suite: syncwave
templates: [render.yaml]
tests:
  - {it: foundation, set: {tsLayer: foundation}, asserts: [{equal: {path: data.wave, value: "-25"}}]}
  - {it: application, set: {tsLayer: application}, asserts: [{equal: {path: data.wave, value: "30"}}]}
  - {it: unknown fails, set: {tsLayer: bogus}, asserts: [{failedTemplate: {errorMessage: "app-factory: unknown dependency-layer \"bogus\""}}]}

  - it: derives kapp change-group and both ordering rules from the same layer
    set: {aApp: {name: cert-manager, domain: infrastructure, version: "1.20.3", team: platform, tier: critical, dependency-layer: core, source: {repoURL: r, path: p}}}
    asserts:
      - {equal: {path: "metadata.annotations['argocd.argoproj.io/sync-wave']", value: "-5"}}
      - {equal: {path: "metadata.annotations['kapp.k14s.io/change-group']", value: "pnats.cloud/layer-core"}}
      - {equal: {path: "metadata.annotations['kapp.k14s.io/change-rule.create-order']", value: "upsert after upserting pnats.cloud/layer-foundation"}}
      - {equal: {path: "metadata.annotations['kapp.k14s.io/change-rule.delete-order']", value: "delete before deleting pnats.cloud/layer-foundation"}}

  - it: foundation has a change-group but no ordering rule (it is first)
    set: {aApp: {name: cilium, domain: infrastructure, version: "1.17.17", team: platform, tier: critical, dependency-layer: foundation, source: {repoURL: r, path: p}}}
    asserts:
      - {equal: {path: "metadata.annotations['kapp.k14s.io/change-group']", value: "pnats.cloud/layer-foundation"}}
      - {notExists: {path: "metadata.annotations['kapp.k14s.io/change-rule.create-order']"}}

  # ── dependency-layer-order: the intra-layer offset that makes a same-layer dependency (t33) real
  - it: dependency-layer-order shifts the wave later within the same layer
    set: {tsLayer: foundation, tsOrder: 1}
    asserts: [{equal: {path: data.wave, value: "-24"}}]

  - it: dependency-layer-order 0 (or unset) is the unchanged base wave
    set: {tsLayer: foundation, tsOrder: 0}
    asserts: [{equal: {path: data.wave, value: "-25"}}]

  - it: the largest order that still stays strictly below the next layer's base is accepted
    set: {tsLayer: foundation, tsOrder: 19}
    asserts: [{equal: {path: data.wave, value: "-6"}}]

  - it: an order that reaches the next layer's base is rejected
    set: {tsLayer: foundation, tsOrder: 20}
    asserts: [{failedTemplate: {errorMessage: 'app-factory: dependency-layer-order 20 pushes layer "foundation"''s sync-wave to -5, which reaches the next layer "core" (base -5) — lower the order'}}]

  - it: a negative order is rejected
    set: {tsLayer: foundation, tsOrder: -1}
    asserts: [{failedTemplate: {errorMessage: "app-factory: dependency-layer-order -1 must be >= 0"}}]

  # ── type-guard, defense-in-depth: syncwave is called directly by app-factory.application, not
  # just reached through app-factory.validate, so it must reject the same bad kinds on its own
  # rather than trust a caller who might skip validate entirely. ─────────────────────────────────
  - it: a boolean order is rejected, not silently coerced to 1
    set: {tsLayer: foundation, tsOrder: true}
    asserts: [{failedTemplate: {errorMessage: "app-factory: dependency-layer-order must be a non-negative integer, got bool true"}}]

  - it: a non-whole float order is rejected, not silently truncated
    set: {tsLayer: foundation, tsOrder: 1.5}
    asserts: [{failedTemplate: {errorMessage: "app-factory: dependency-layer-order must be a whole number, got 1.5"}}]

  - it: a non-numeric string order is rejected, not silently coerced to 0
    set: {tsLayer: foundation, tsOrder: abc}
    asserts: [{failedTemplate: {errorMessage: "app-factory: dependency-layer-order must be a non-negative integer, got string abc"}}]
