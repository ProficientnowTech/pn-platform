apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: github-webhook
  namespace: argo-events
spec:
  service:
    ports:
      - port: 12000
        targetPort: 12000
  webhook:
    github:
      endpoint: /github
      port: '12000'
      method: POST
      authSecret:
        name: github-webhook-secret
        key: secret
