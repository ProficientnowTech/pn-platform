apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: ci-trigger
  namespace: argo-events
spec:
  eventBusName: default
  template:
    serviceAccountName: argo-events-sa
  dependencies:
    - name: pr-opened
      eventSourceName: github-webhook
      eventName: pnow-ats-v2
      filters:
        data:
          - path: body.action
            type: string
            value:
              - opened
              - synchronize
              - reopened
    - name: pr-merged-develop
      eventSourceName: github-webhook
      eventName: pnow-ats-v2
      filters:
        data:
          - path: body.action
            type: string
            value:
              - closed
          - path: body.pull_request.merged
            type: bool
            value:
              - 'true'
          - path: body.pull_request.base.ref
            type: string
            value:
              - develop
    - name: pr-merged-main
      eventSourceName: github-webhook
      eventName: pnow-ats-v2
      filters:
        data:
          - path: body.action
            type: string
            value:
              - closed
          - path: body.pull_request.merged
            type: bool
            value:
              - 'true'
          - path: body.pull_request.base.ref
            type: string
            value:
              - main
  triggers:
    - template:
        name: pr-validation
        conditions: pr-opened
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: pr-validate-
                namespace: argo
                labels:
                  pipeline: pr-validation
              spec:
                workflowTemplateRef:
                  name: pr-validation
                arguments:
                  parameters:
                    - name: head-sha
                    - name: branch
                    - name: pr-number
                    - name: base-branch
          parameters:
            - src:
                dependencyName: pr-opened
                dataKey: body.pull_request.head.sha
              dest: spec.arguments.parameters.0.value
            - src:
                dependencyName: pr-opened
                dataKey: body.pull_request.head.ref
              dest: spec.arguments.parameters.1.value
            - src:
                dependencyName: pr-opened
                dataKey: body.number
              dest: spec.arguments.parameters.2.value
            - src:
                dependencyName: pr-opened
                dataKey: body.pull_request.base.ref
              dest: spec.arguments.parameters.3.value
    - template:
        name: post-merge-staging
        conditions: pr-merged-develop
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: build-staging-
                namespace: argo
                labels:
                  pipeline: post-merge
                  environment: staging
              spec:
                workflowTemplateRef:
                  name: post-merge-build
                arguments:
                  parameters:
                    - name: commit-sha
                    - name: base-branch
          parameters:
            - src:
                dependencyName: pr-merged-develop
                dataKey: body.pull_request.merge_commit_sha
              dest: spec.arguments.parameters.0.value
            - src:
                dependencyName: pr-merged-develop
                dataKey: body.pull_request.base.ref
              dest: spec.arguments.parameters.1.value
    - template:
        name: post-merge-production
        conditions: pr-merged-main
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: build-prod-
                namespace: argo
                labels:
                  pipeline: post-merge
                  environment: production
              spec:
                workflowTemplateRef:
                  name: post-merge-build
                arguments:
                  parameters:
                    - name: commit-sha
                    - name: base-branch
          parameters:
            - src:
                dependencyName: pr-merged-main
                dataKey: body.pull_request.merge_commit_sha
              dest: spec.arguments.parameters.0.value
            - src:
                dependencyName: pr-merged-main
                dataKey: body.pull_request.base.ref
              dest: spec.arguments.parameters.1.value
