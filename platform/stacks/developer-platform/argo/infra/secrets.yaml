      remoteRef:
        key: ci/github
        property: app-id
    - secretKey: installation-id
      remoteRef:
        key: ci/github
        property: installation-id
    - secretKey: app-private-key
      remoteRef:
        key: ci/github
        property: app-private-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argo-workflows-db
  namespace: argo
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: argo-workflows-db
  data:
    - secretKey: username
      remoteRef:
        key: platform-data/postgres/argoworkflows
        property: username
    - secretKey: password
      remoteRef:
        key: platform-data/postgres/argoworkflows
        property: password
