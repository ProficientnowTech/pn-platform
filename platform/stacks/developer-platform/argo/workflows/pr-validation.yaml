apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: pr-validation
  namespace: argo
spec:
  arguments:
    parameters:
      - name: head-sha
      - name: branch
      - name: pr-number
      - name: base-branch
  entrypoint: validate
  onExit: report-failure
  serviceAccountName: ci-workflow
  synchronization:
    mutex:
      name: ci-workspace
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: ci-workspace
    - name: ssh-key
      secret:
        secretName: github-ssh-key
        defaultMode: 0400
  templates:
    - name: validate
      dag:
        tasks:
          - name: report-pending
            template: github-status
            arguments:
              parameters:
                - name: sha
                  value: '{{workflow.parameters.head-sha}}'
                - name: state
                  value: pending
                - name: description
                  value: 'CI validation in progress'
          - name: git-sync
            template: git-sync
            arguments:
              parameters:
                - name: sha
                  value: '{{workflow.parameters.head-sha}}'
          - name: install
            template: pnpm-install
            depends: git-sync
          - name: generate-dag
            template: generate-task-dag
            depends: install
            arguments:
              parameters:
                - name: base
                  value: 'origin/{{workflow.parameters.base-branch}}'
                - name: head
                  value: '{{workflow.parameters.head-sha}}'
                - name: targets
                  value: 'lint,test,build'
          - name: run-tasks
            template: submit-task-workflow
            depends: generate-dag
            arguments:
              parameters:
                - name: workflow-spec
                  value: '{{tasks.generate-dag.outputs.parameters.workflow-yaml}}'
          - name: report-success
            template: github-status
            depends: run-tasks
            arguments:
              parameters:
                - name: sha
                  value: '{{workflow.parameters.head-sha}}'
                - name: state
                  value: success
                - name: description
                  value: 'CI validation passed'

    - name: git-sync
      inputs:
        parameters:
          - name: sha
      container:
        image: registry.pnats.cloud/pnats/ci-tools:latest
        command: [sh, -c]
        args:
          - |
            cd /workspace
            if [ ! -d ".git" ]; then
              git clone git@github.com:snoorullah/pnow-ats-v2.git .
            else
              git fetch origin --prune
            fi
            git checkout --force {{inputs.parameters.sha}}
            git clean -fd
        env:
          - name: GIT_SSH_COMMAND
            value: 'ssh -i /root/.ssh/ssh-privatekey -o StrictHostKeyChecking=no'
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: ssh-key
            mountPath: /root/.ssh

    - name: pnpm-install
      retryStrategy:
        limit: '2'
        retryPolicy: OnError
        backoff:
          duration: 10s
          factor: 2
      container:
        image: registry.pnats.cloud/pnats/ci-tools:latest
        command: [sh, -c]
        args:
          - cd /workspace && pnpm install --prefer-offline --frozen-lockfile
        resources:
          requests:
            cpu: '2'
            memory: 4Gi
          limits:
            cpu: '2'
            memory: 4Gi
        volumeMounts:
          - name: workspace
            mountPath: /workspace

    - name: generate-task-dag
      inputs:
        parameters:
          - name: base
          - name: head
          - name: targets
      outputs:
        parameters:
          - name: workflow-yaml
            valueFrom:
              path: /tmp/task-workflow.yaml
          - name: affected-apps
            valueFrom:
              path: /tmp/affected-apps.json
      container:
        image: registry.pnats.cloud/pnats/ci-tools:latest
        command: [node, /workspace/tools/ci/generate-argo-dag.mjs]
        env:
          - name: BASE_SHA
            value: '{{inputs.parameters.base}}'
          - name: HEAD_SHA
            value: '{{inputs.parameters.head}}'
          - name: TARGETS
            value: '{{inputs.parameters.targets}}'
          - name: CI_IMAGE
            value: 'registry.pnats.cloud/pnats/ci-tools:latest'
          - name: WORKSPACE_PVC
            value: 'ci-workspace'
          - name: NAMESPACE
            value: 'argo'
        volumeMounts:
          - name: workspace
            mountPath: /workspace

    - name: submit-task-workflow
      inputs:
        parameters:
          - name: workflow-spec
      resource:
        action: create
        successCondition: status.phase == Succeeded
        failureCondition: status.phase in (Failed, Error)
        manifest: '{{inputs.parameters.workflow-spec}}'

    - name: github-status
      inputs:
        parameters:
          - name: sha
          - name: state
          - name: description
      container:
        image: registry.pnats.cloud/pnats/ci-tools:latest
        command: [sh, -c]
        args:
          - |
            curl -s -X POST \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{
                \"state\": \"{{inputs.parameters.state}}\",
                \"target_url\": \"https://argo.pnats.cloud\",
                \"description\": \"{{inputs.parameters.description}}\",
                \"context\": \"argo-ci/validation\"
              }" \
              "https://api.github.com/repos/snoorullah/pnow-ats-v2/statuses/{{inputs.parameters.sha}}"
        env:
          - name: GITHUB_TOKEN
            valueFrom:
              secretKeyRef:
                name: github-token
                key: token

    - name: report-failure
      container:
        image: registry.pnats.cloud/pnats/ci-tools:latest
        command: [sh, -c]
        args:
          - |
            if [ "{{workflow.status}}" != "Succeeded" ]; then
              curl -s -X POST \
                -H "Authorization: token ${GITHUB_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "{
                  \"state\": \"failure\",
                  \"target_url\": \"https://argo.pnats.cloud\",
                  \"description\": \"CI validation failed\",
                  \"context\": \"argo-ci/validation\"
                }" \
                "https://api.github.com/repos/snoorullah/pnow-ats-v2/statuses/{{workflow.parameters.head-sha}}"
            fi
        env:
          - name: GITHUB_TOKEN
            valueFrom:
              secretKeyRef:
                name: github-token
                key: token
