apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: post-merge-build
  namespace: argo
spec:
  arguments:
    parameters:
      - name: commit-sha
      - name: base-branch
  entrypoint: build-and-deploy
  onExit: report-failure-slack
  serviceAccountName: ci-workflow
  synchronization:
    mutex:
      name: ci-workspace
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: ci-workspace
    - name: ssh-key
      secret:
        secretName: github-ssh-key
        defaultMode: 0400
    - name: docker-config
      secret:
        secretName: harbor-docker-config
  templates:
    - name: build-and-deploy
      dag:
        tasks:
          - name: git-sync
            template: git-sync
            arguments:
              parameters:
                - name: sha
                  value: '{{`{{workflow.parameters.commit-sha}}`}}'
          - name: install
            template: pnpm-install
            depends: git-sync
          - name: generate-dag
            template: generate-task-dag
            depends: install
            arguments:
              parameters:
                - name: base
                  value: 'origin/{{`{{workflow.parameters.base-branch}}`}}~1'
                - name: head
                  value: '{{`{{workflow.parameters.commit-sha}}`}}'
                - name: targets
                  value: 'build'
          - name: run-tasks
            template: submit-task-workflow
            depends: generate-dag
            arguments:
              parameters:
                - name: workflow-spec
                  value: '{{`{{tasks.generate-dag.outputs.parameters.workflow-yaml}}`}}'
          - name: publish-packages
            template: npm-publish
            depends: run-tasks
          - name: docker-builds
            template: kaniko-fan-out
            depends: publish-packages
            arguments:
              parameters:
                - name: services
                  value: '{{`{{tasks.generate-dag.outputs.parameters.affected-apps}}`}}'
                - name: tag
                  value: '{{`{{workflow.parameters.commit-sha}}`}}'
          - name: update-gitops
            template: gitops-update
            depends: docker-builds
            arguments:
              parameters:
                - name: services
                  value: '{{`{{tasks.generate-dag.outputs.parameters.affected-apps}}`}}'
                - name: tag
                  value: '{{`{{workflow.parameters.commit-sha}}`}}'
          - name: notify
            template: slack-notify
            depends: update-gitops
            arguments:
              parameters:
                - name: services
                  value: '{{`{{tasks.generate-dag.outputs.parameters.affected-apps}}`}}'
                - name: status
                  value: 'success'

    - name: git-sync
      inputs:
        parameters:
          - name: sha
      container:
        image: {{ .Values.ciImage }}
        command: [sh, -c]
        args:
          - |
            mkdir -p /tmp/.ssh
            cp /secret-ssh/ssh-privatekey /tmp/.ssh/id_rsa
            chmod 600 /tmp/.ssh/id_rsa
            export GIT_SSH_COMMAND="ssh -i /tmp/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
            cd /workspace
            if [ ! -d ".git" ]; then
              git clone git@github.com:{{ .Values.github.owner }}/{{ .Values.github.repo }}.git .
            else
              git fetch origin --prune
            fi
            git checkout --force {{`{{inputs.parameters.sha}}`}}
            git clean -fd
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: ssh-key
            mountPath: /secret-ssh
            readOnly: true

    - name: pnpm-install
      retryStrategy:
        limit: '2'
        retryPolicy: OnError
        backoff:
          duration: 10s
          factor: 2
      container:
        image: {{ .Values.ciImage }}
        command: [sh, -c]
        args:
          - cd /workspace && pnpm install --prefer-offline --frozen-lockfile
        resources:
          requests:
            cpu: '2'
            memory: 4Gi
          limits:
            cpu: '2'
            memory: 4Gi
        volumeMounts:
          - name: workspace
            mountPath: /workspace

    - name: generate-task-dag
      activeDeadlineSeconds: 600
      inputs:
        parameters:
          - name: base
          - name: head
          - name: targets
      outputs:
        parameters:
          - name: workflow-yaml
            valueFrom:
              path: /tmp/task-workflow.yaml
          - name: affected-apps
            valueFrom:
              path: /tmp/affected-apps.json
      container:
        image: {{ .Values.ciImage }}
        command: [node, --max-old-space-size=4096, /workspace/tools/ci/generate-argo-dag.mjs]
        env:
          - name: BASE_SHA
            value: '{{`{{inputs.parameters.base}}`}}'
          - name: HEAD_SHA
            value: '{{`{{inputs.parameters.head}}`}}'
          - name: TARGETS
            value: '{{`{{inputs.parameters.targets}}`}}'
          - name: CI_IMAGE
            value: {{ .Values.ciImage | quote }}
          - name: WORKSPACE_PVC
            value: 'ci-workspace'
          - name: NAMESPACE
            value: 'argo'
        resources:
          requests:
            cpu: '2'
            memory: 4Gi
          limits:
            cpu: '2'
            memory: 4Gi
        volumeMounts:
          - name: workspace
            mountPath: /workspace

    - name: submit-task-workflow
      inputs:
        parameters:
          - name: workflow-spec
      resource:
        action: create
        successCondition: status.phase == Succeeded
        failureCondition: status.phase in (Failed, Error)
        manifest: '{{`{{inputs.parameters.workflow-spec}}`}}'

    - name: npm-publish
      container:
        image: {{ .Values.ciImage }}
        command: [sh, -c]
        args:
          - cd /workspace && npx nx release publish --yes
        volumeMounts:
          - name: workspace
            mountPath: /workspace

    - name: kaniko-fan-out
      inputs:
        parameters:
          - name: services
          - name: tag
      steps:
        - - name: build
            template: kaniko-build
            arguments:
              parameters:
                - name: name
                  value: '{{`{{item.name}}`}}'
                - name: dockerfile
                  value: '{{`{{item.dockerfile}}`}}'
                - name: kaniko-args
                  value: '{{`{{item.kanikoArgs}}`}}'
                - name: tag
                  value: '{{`{{inputs.parameters.tag}}`}}'
            withParam: '{{`{{inputs.parameters.services}}`}}'

    - name: kaniko-build
      inputs:
        parameters:
          - name: name
          - name: dockerfile
          - name: kaniko-args
          - name: tag
      retryStrategy:
        limit: '3'
        retryPolicy: OnError
        backoff:
          duration: 30s
          factor: 2
          maxDuration: 5m
        affinity:
          nodeAntiAffinity: {}
      script:
        image: gcr.io/kaniko-project/executor:v1.23.2-debug
        command: [/busybox/sh]
        source: |
          /kaniko/executor \
            --dockerfile={{`{{inputs.parameters.dockerfile}}`}} \
            --context=/workspace \
            --destination=registry.pnats.cloud/pnats/{{`{{inputs.parameters.name}}`}}:{{`{{inputs.parameters.tag}}`}} \
            --destination=registry.pnats.cloud/pnats/{{`{{inputs.parameters.name}}`}}:latest \
            --cache=true \
            --cache-repo=registry.pnats.cloud/pnats/build-cache/{{`{{inputs.parameters.name}}`}} \
            --snapshot-mode=redo \
            --compressed-caching=false \
            {{`{{inputs.parameters.kaniko-args}}`}}
        resources:
          requests:
            cpu: '2'
            memory: 4Gi
          limits:
            cpu: '4'
            memory: 8Gi
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: docker-config
            mountPath: /kaniko/.docker

    - name: gitops-update
      inputs:
        parameters:
          - name: services
          - name: tag
      retryStrategy:
        limit: '5'
        retryPolicy: OnError
        backoff:
          duration: 5s
          factor: 2
      container:
        image: {{ .Values.ciImage }}
        command: [sh, -c]
        args:
          - |
            export GIT_SSH_COMMAND="ssh -i /root/.ssh/ssh-privatekey -o StrictHostKeyChecking=no"
            git clone --branch v2 git@github.com:ProficientnowTech/pn-infra.git /tmp/pn-infra
            cd /tmp/pn-infra

            echo '{{`{{inputs.parameters.services}}`}}' | jq -r '.[] | "\(.name) \(.helmValuesPath)"' | while read name values_path; do
              if [ -f "${values_path}" ]; then
                sed -i "s|tag:.*|tag: {{`{{inputs.parameters.tag}}`}}|g" "${values_path}"
              fi
            done

            git config user.name "CI Bot"
            git config user.email "ci@proficientnow.com"

            if ! git diff --quiet; then
              git add -A
              git commit -m "chore(deploy): update image tags to {{`{{inputs.parameters.tag}}`}}"

              ATTEMPT=0
              while [ $ATTEMPT -lt 5 ]; do
                if git push origin v2; then
                  echo "Push succeeded on attempt $((ATTEMPT + 1))"
                  break
                fi
                ATTEMPT=$((ATTEMPT + 1))
                echo "Push failed, attempt ${ATTEMPT}/5 — rebasing and retrying..."
                git fetch origin v2
                git rebase origin/v2
              done

              if [ $ATTEMPT -eq 5 ]; then
                echo "Failed to push after 5 attempts"
                exit 1
              fi
            else
              echo "No changes to commit"
            fi
        env:
          - name: GIT_SSH_COMMAND
            value: 'ssh -i /root/.ssh/ssh-privatekey -o StrictHostKeyChecking=no'
        volumeMounts:
          - name: ssh-key
            mountPath: /root/.ssh

    - name: slack-notify
      inputs:
        parameters:
          - name: services
          - name: status
      container:
        image: {{ .Values.ciImage }}
        command: [sh, -c]
        args:
          - |
            SERVICE_NAMES=$(echo '{{`{{inputs.parameters.services}}`}}' | jq -r '[.[].name] | join(", ")')
            curl -s -X POST \
              -H "Content-Type: application/json" \
              -d "{
                \"blocks\": [
                  {
                    \"type\": \"section\",
                    \"text\": {
                      \"type\": \"mrkdwn\",
                      \"text\": \"*Build Status:* {{`{{inputs.parameters.status}}`}}\n*SHA:* {{`{{workflow.parameters.commit-sha}}`}}\n*Services:* ${SERVICE_NAMES}\n*Workflow:* <https://argo.pnats.cloud/workflows/argo/{{`{{workflow.name}}`}}|View workflow>\"
                    }
                  }
                ]
              }" \
              "${SLACK_WEBHOOK_URL}"
        env:
          - name: SLACK_WEBHOOK_URL
            valueFrom:
              secretKeyRef:
                name: slack-webhook
                key: url

    - name: report-failure-slack
      container:
        image: {{ .Values.ciImage }}
        command: [sh, -c]
        args:
          - |
            if [ "{{`{{workflow.status}}`}}" != "Succeeded" ]; then
              curl -s -X POST \
                -H "Content-Type: application/json" \
                -d "{
                  \"blocks\": [
                    {
                      \"type\": \"section\",
                      \"text\": {
                        \"type\": \"mrkdwn\",
                        \"text\": \"*Build FAILED*\n*Branch:* {{`{{workflow.parameters.base-branch}}`}}\n*SHA:* {{`{{workflow.parameters.commit-sha}}`}}\n*Workflow:* <https://argo.pnats.cloud/workflows/argo/{{`{{workflow.name}}`}}|View workflow>\"
                      }
                    }
                  ]
                }" \
                "${SLACK_WEBHOOK_URL}"
            fi
        env:
          - name: SLACK_WEBHOOK_URL
            valueFrom:
              secretKeyRef:
                name: slack-webhook
                key: url
