# PostgreSQL Cluster: ${{ values.teamId }}-${{ values.clusterName }}
# Generated by Backstage Developer Portal
# Namespace: ${{ values.namespace }}
---
apiVersion: database.pnats.cloud/v1alpha1
kind: PostgresCluster
metadata:
  name: ${{ values.teamId }}-${{ values.clusterName }}
  namespace: ${{ values.namespace }}
  labels:
    app.kubernetes.io/managed-by: backstage
    app.kubernetes.io/created-by: scaffolder
    team: ${{ values.teamId }}
spec:
  teamId: ${{ values.teamId }}
  clusterName: ${{ values.clusterName }}
  postgresVersion: "${{ values.postgresVersion }}"
  numberOfInstances: ${{ values.numberOfInstances }}

  storage:
    size: "${{ values.storageSize }}"
    storageClass: "app-blk-ssd-repl"

  {%- if values.resourcePreset == "small" %}
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
  {%- elif values.resourcePreset == "medium" %}
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "2Gi"
  {%- elif values.resourcePreset == "large" %}
  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "4"
      memory: "4Gi"
  {%- elif values.resourcePreset == "xlarge" %}
  resources:
    requests:
      cpu: "2"
      memory: "4Gi"
    limits:
      cpu: "8"
      memory: "8Gi"
  {%- endif %}

  # Database users
  users:
    {%- for db in values.databases %}
    ${{ db.owner }}:
      - LOGIN
    {%- endfor %}
    {%- for user in values.additionalUsers %}
    ${{ user.name }}:
      - LOGIN
      {%- if user.superuser %}
      - SUPERUSER
      {%- endif %}
    {%- endfor %}
    {%- if values.enableDebezium %}
    ${{ values.debeziumUser }}:
      - REPLICATION
      - LOGIN
    {%- endif %}

  # Databases
  databases:
    {%- for db in values.databases %}
    ${{ db.name }}: ${{ db.owner }}
    {%- endfor %}

  # Connection Pooler (PgBouncer)
  connectionPooler:
    enabled: ${{ values.enablePooler }}
    mode: "${{ values.poolerMode }}"
    numberOfInstances: 2
    resources:
      requests:
        cpu: "250m"
        memory: "128Mi"
      limits:
        cpu: "1"
        memory: "256Mi"

  # Debezium CDC Support
  debezium:
    enabled: ${{ values.enableDebezium }}
    {%- if values.enableDebezium %}
    replicationUser: "${{ values.debeziumUser }}"
    {%- endif %}

  # External Access
  ingress:
    enabled: ${{ values.enableIngress }}
    {%- if values.enableIngress %}
    pooler:
      host: "${{ values.poolerHost }}"
    direct:
      host: "${{ values.directHost }}"
    tls:
      enabled: true
      clusterIssuer: "letsencrypt-production"
    {%- endif %}

  {%- if values.enableDebezium %}
  # PostgreSQL parameters for CDC
  postgresParameters:
    wal_level: "logical"
    max_replication_slots: "10"
    max_wal_senders: "10"
  {%- endif %}

  # Backup configuration (WAL-G to Ceph S3)
  backup:
    enabled: ${{ values.enableBackup }}
    {%- if values.enableBackup %}
    retentionDays: ${{ values.backupRetentionDays }}
    schedule: "${{ values.backupSchedule }}"
    storageClass: "app-obj-s3"
    maxSize: "${{ values.backupMaxSize }}"
    {%- endif %}
