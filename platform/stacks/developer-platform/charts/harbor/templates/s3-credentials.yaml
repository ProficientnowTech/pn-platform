{{/*
  Secret: harbor-s3-creds
  Pulls the original S3 credentials from Vault for Harbor registry storage.

  These credentials were created when the Harbor OBC was first provisioned and
  pushed to Vault via PushSecret. They have full access to the harbor bucket.

  The secret is separate from harbor-registry (which the upstream Harbor Helm
  chart uses for REGISTRY_REDIS_PASSWORD) to avoid naming conflicts.
*/}}
{{- if .Values.objectBucket.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-storage-s3
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-storage-s3
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: applications/developer-platform/harbor/s3
        metadataPolicy: None
        property: REGISTRY_STORAGE_S3_ACCESSKEY
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: applications/developer-platform/harbor/s3
        metadataPolicy: None
        property: REGISTRY_STORAGE_S3_SECRETKEY
{{- end }}
