apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sysctl-inotify-tuning
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/part-of: pnats-ci
spec:
  selector:
    matchLabels:
      app: sysctl-inotify-tuning
  template:
    metadata:
      labels:
        app: sysctl-inotify-tuning
    spec:
      hostPID: true
      initContainers:
        - name: sysctl
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              sysctl -w fs.inotify.max_user_instances=1024
              sysctl -w fs.inotify.max_user_watches=524288
          securityContext:
            privileged: true
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              cpu: 1m
              memory: 4Mi
      tolerations:
        - operator: Exists
