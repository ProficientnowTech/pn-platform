apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: update-image-tag
  namespace: tekton-pipelines
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/part-of: pnats-ci
spec:
  description: |
    Updates ALL image tags in a Kustomize overlay to trigger ArgoCD deployment.
    Also syncs base manifests from the app repo into the infra repo.
  params:
    - name: image-tag
      type: string
      description: New image tag to set for all images
    - name: environment
      type: string
      default: staging
      description: Target environment (staging, production)
    - name: infra-repo-url
      type: string
      default: git@github.com:ProficientnowTech/pn-infra-main.git
    - name: infra-repo-branch
      type: string
      default: main
  workspaces:
    - name: output
      description: Workspace for infra repo checkout
    - name: ssh-credentials
      description: SSH key for git push
  steps:
    - name: update-and-push
      image: alpine/git:2.43.0
      script: |
        #!/usr/bin/env sh
        set -eu

        # Setup SSH
        if [ -d "$(workspaces.ssh-credentials.path)" ]; then
          cp -R "$(workspaces.ssh-credentials.path)" /root/.ssh
          chmod 700 /root/.ssh
          chmod -R 400 /root/.ssh/*
          ssh-keyscan github.com >> /root/.ssh/known_hosts 2>/dev/null
        fi

        cd "$(workspaces.output.path)"

        # Clone infra repo
        git clone --depth 1 --branch "$(params.infra-repo-branch)" "$(params.infra-repo-url)" infra
        cd infra

        OVERLAY_DIR="application/pnats/overlays/$(params.environment)"
        KUSTOMIZATION="${OVERLAY_DIR}/kustomization.yaml"

        if [ ! -f "${KUSTOMIZATION}" ]; then
          echo "ERROR: Overlay not found at ${KUSTOMIZATION}"
          exit 1
        fi

        # Sync base manifests from app workspace into infra repo
        APP_BASE="$(workspaces.output.path)/k8s/base"
        INFRA_BASE="application/pnats/base"
        if [ -d "${APP_BASE}" ]; then
          rm -rf "${INFRA_BASE}"
          cp -R "${APP_BASE}" "${INFRA_BASE}"
        fi

        # Replace ALL newTag values in the overlay kustomization.yaml
        sed -i "s/newTag: .*/newTag: $(params.image-tag)/g" "${KUSTOMIZATION}"

        # Commit and push
        git config user.email "tekton@pnats.cloud"
        git config user.name "Tekton CI"
        git add "${INFRA_BASE}" "${KUSTOMIZATION}"

        if git diff --cached --quiet; then
          echo "No changes to commit"
          exit 0
        fi

        git commit -m "deploy($(params.environment)): update all images to $(params.image-tag)"
        git push origin "$(params.infra-repo-branch)"
