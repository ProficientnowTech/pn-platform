# Production Environment
# Platform Developer Platform applications with sync wave ordering
applications:
# Tekton Operator must deploy first - provides CRDs for TektonConfig/TektonDashboard
# Uses Helm chart from kubebb repository (faster than GitHub clone)
- name: tekton-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  destinationNamespaceOverwrite: tekton-operator
  repoURL: https://kubebb.github.io/components
  chart: tekton-operator
  targetRevision: 0.64.0
  helm:
    releaseName: tekton-operator
    parameters:
    - name: operator.autoInstallComponents
      value: "true"
  # CRDs are mutated by the apiserver (status/managedFields/annotations), which
  # makes ArgoCD show them as OutOfSync even though the desired spec matches.
  ignoreDifferences:
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
    jqPathExpressions:
    - .status
    - .metadata.annotations
    - .metadata.generation
    - .metadata.managedFields
    - .spec.preserveUnknownFields
  syncOptions:
  - CreateNamespace=true
  - ServerSideApply=true
  # Replace=true needed because kubebb Helm chart has managedFields baked into CRD templates
  - Replace=true

- name: tekton-dashboard
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
  destinationNamespaceOverwrite: tekton-pipelines
  ignoreDifferences:
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
    name: extensions.dashboard.tekton.dev
    jqPathExpressions:
    - .spec.preserveUnknownFields
  syncOptions:
  - CreateNamespace=true
  - ServerSideApply=true

- name: backstage
  annotations:
    argocd.argoproj.io/sync-wave: '0'
  destinationNamespaceOverwrite: backstage
  syncOptions:
  - ServerSideApply=true
  - CreateNamespace=true

- name: harbor
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  destinationNamespaceOverwrite: harbor
  syncOptions:
  - ServerSideApply=true
  - CreateNamespace=true

- name: verdaccio
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  destinationNamespaceOverwrite: verdaccio
  syncOptions:
  - ServerSideApply=true
  - CreateNamespace=true

- name: argo-workflows
  annotations:
    argocd.argoproj.io/sync-wave: "25"
  destinationNamespaceOverwrite: argo
  repoURL: https://argoproj.github.io/argo-helm
  chart: argo-workflows
  targetRevision: 0.42.x
  helm:
    releaseName: argo-workflows
    parameters:
    - name: server.extraArgs[0]
      value: "--auth-mode=server"
    - name: server.ingress.enabled
      value: "true"
    - name: server.ingress.hosts[0]
      value: "argo.pnats.cloud"
    - name: server.ingress.tls[0].secretName
      value: "argo-tls"
    - name: server.ingress.tls[0].hosts[0]
      value: "argo.pnats.cloud"
    - name: controller.workflowDefaults.spec.serviceAccountName
      value: "ci-workflow"
    - name: controller.workflowDefaults.spec.activeDeadlineSeconds
      value: "10800"
    - name: controller.workflowDefaults.spec.ttlStrategy.secondsAfterCompletion
      value: "7200"
    - name: controller.workflowDefaults.spec.podGC.strategy
      value: "OnWorkflowCompletion"
    - name: controller.persistence.archive
      value: "false"
    - name: artifactRepository.s3.bucket
      value: "argo-artifacts"
    - name: artifactRepository.s3.endpoint
      value: "rook-ceph-rgw-store.rook-ceph.svc:80"
    - name: artifactRepository.s3.insecure
      value: "true"
    - name: artifactRepository.s3.accessKeySecret.name
      value: "argo-s3-creds"
    - name: artifactRepository.s3.accessKeySecret.key
      value: "access-key"
    - name: artifactRepository.s3.secretKeySecret.name
      value: "argo-s3-creds"
    - name: artifactRepository.s3.secretKeySecret.key
      value: "secret-key"
  syncOptions:
  - CreateNamespace=true
  - ServerSideApply=true

- name: argo-events
  annotations:
    argocd.argoproj.io/sync-wave: "26"
