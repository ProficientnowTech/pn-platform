{{- if .Values.tektonConfig.enabled }}
apiVersion: operator.tekton.dev/v1alpha1
kind: TektonConfig
metadata:
  name: config
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  profile: all
  targetNamespace: tekton-pipelines
  pipeline:
    enable-api-fields: stable
    enable-tekton-oci-bundles: true
  trigger:
    enable-api-fields: stable
  pruner:
    resources:
    - pipelinerun
    - taskrun
    keep: 5
    schedule: "0 */6 * * *"
{{- end }}
