# Tekton Operator Configuration
global:
  namespace: tekton
  project: development-workloads

tektonConfig:
  # Disabled — operator auto-creates TektonConfig via autoInstallComponents=true.
  # Enabling causes ArgoCD sync error: "expected kind, but got map"
  # (TektonConfig CRD uses x-kubernetes-preserve-unknown-fields which
  # confuses ArgoCD's resource normalization).
  enabled: false
  # PostSync Job patches the operator's auto-created TektonConfig with pruner settings
  patchEnabled: true
  prunerKeep: 5
  prunerSchedule: "0 */6 * * *"

tektonDashboardCR:
  # Disabled by default because the Tekton Operator deploys the dashboard using
  # upstream release manifests that reference `gcr.io/...`, which can fail to
  # pull (403). We deploy the dashboard via `platform/stacks/developer-platform/charts/tekton-dashboard`
  # using a working image registry instead.
  enabled: false

ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    external-dns.alpha.kubernetes.io/ttl: "60"
  className: nginx
  tls:
    enabled: true
  host: tekton.pnats.cloud

operator:
  name: tekton-operator-app
  source:
    repo: https://storage.googleapis.com/tekton-releases
    targetRevision: latest
    path: operator/latest
  namespace: tekton-operator
