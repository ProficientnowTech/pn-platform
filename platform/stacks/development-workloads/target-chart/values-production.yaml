- name: pnats-apps
  annotations:
    argocd.argoproj.io/sync-wave: "30"
  path: business/apps/pnats
  destinationNamespaceOverwrite: argocd
  syncOptions:
  - CreateNamespace=false
  - RespectIgnoreDifferences=true

