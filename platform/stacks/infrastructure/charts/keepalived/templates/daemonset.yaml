apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: keepalived
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: keepalived
    app.kubernetes.io/component: networking
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: keepalived
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keepalived
        app.kubernetes.io/component: networking
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      serviceAccountName: keepalived
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: keepalived
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: KEEPALIVED_INTERFACE
              value: {{ .Values.vip.interface }}
            - name: KEEPALIVED_VIRTUAL_IPS
              value: {{ .Values.vip.address }}
            - name: KEEPALIVED_UNICAST_PEERS
              value: ""
            - name: KEEPALIVED_PASSWORD
              value: {{ .Values.vrrp.authPass }}
            - name: KEEPALIVED_PRIORITY
              value: "100"
            - name: KEEPALIVED_ROUTER_ID
              value: "{{ .Values.vrrp.routerId }}"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_BROADCAST
                - NET_RAW
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep keepalived
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep keepalived
            initialDelaySeconds: 5
            periodSeconds: 5
