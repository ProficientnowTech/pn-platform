---
# OpenEverest Configuration (MongoDB-only)
# Upstream values ref: https://github.com/openeverest/helm-charts/blob/main/charts/openeverest/values.yaml
openeverest:
  namespaceOverride: everest-system

  # Disable telemetry
  telemetry: false

  # Disable preflight checks for ArgoCD compatibility (hooks don't work well)
  upgrade:
    preflightChecks: false

  # Database namespace — MongoDB operator only
  dbNamespace:
    enabled: true
    namespaceOverride: everest
    psmdb: true
    pxc: false
    postgresql: false

  # Data importers — MongoDB only
  dataImporters:
    perconaPSMDBOperator:
      enabled: true
    perconaPGOperator:
      enabled: false
    perconaPXCOperator:
      enabled: false

  # Server configuration
  server:
    initialAdminPassword: "Everest@Pn2026!"
    apiRequestsRateLimit: 100

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    service:
      type: ClusterIP
      port: 8080

    rbac:
      enabled: true
      policy: |
        g, admin, role:admin

    tls:
      enabled: true
      secret:
        name: everest-server-tls
      certificate:
        create: true
        domain: everest.pnats.cloud
        issuer:
          kind: ClusterIssuer
          name: letsencrypt-production

  # Ingress
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: everest.pnats.cloud
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: everest-server-tls
        hosts:
          - everest.pnats.cloud

  # Monitoring — disable (we use our own Prometheus/Loki stack)
  createMonitoringResources: false
  monitoring:
    enabled: false
  kube-state-metrics:
    enabled: false
  pmm:
    enabled: false
  pmm3:
    enabled: false
