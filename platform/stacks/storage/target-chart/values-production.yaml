- name: scylladb-operator
  annotations:
    argocd.argoproj.io/sync-wave: '0'
  destinationNamespaceOverwrite: scylla-operator
  syncOptions:
  - ServerSideApply=true
  - Replace=true

- name: percona-everest
  annotations:
    argocd.argoproj.io/sync-wave: '0'
  destinationNamespaceOverwrite: everest-system
  syncOptions:
  - CreateNamespace=true
  - ServerSideApply=true
  - Replace=true
  - SkipDryRunOnMissingResource=true
  - RespectIgnoreDifferences=true
  ignoreDifferences:
  # Everest operator updates LoadBalancerConfig status
  - group: everest.percona.com
    kind: LoadBalancerConfig
    jqPathExpressions:
    - .status
    - .metadata.finalizers
  # PodSchedulingPolicy resources are created/managed by Everest operators
  - group: everest.percona.com
    kind: PodSchedulingPolicy
    jqPathExpressions:
    - .metadata.resourceVersion
    - .metadata.uid
    - .metadata.generation
    - .metadata.creationTimestamp
    - .metadata.managedFields
  # Secrets auto-generated by OLM/cert-manager
  - kind: Secret
    name: packageserver-service-cert
    jqPathExpressions:
    - .data
    - .metadata
  - kind: Secret
    name: everest-jwt
    jqPathExpressions:
    - .data
    - .metadata
  - kind: Secret
    name: webhook-server-cert
    jqPathExpressions:
    - .data
    - .metadata
  # Webhook configurations get caBundle injected by cert-manager
  - group: admissionregistration.k8s.io
    kind: MutatingWebhookConfiguration
    jqPathExpressions:
    - .webhooks[].clientConfig.caBundle
    - .metadata.annotations
  - group: admissionregistration.k8s.io
    kind: ValidatingWebhookConfiguration
    jqPathExpressions:
    - .webhooks[].clientConfig.caBundle
    - .metadata.annotations
  # Certificate managed by cert-manager
  - group: cert-manager.io
    kind: Certificate
    jqPathExpressions:
    - .status
    - .metadata.managedFields
  # APIService managed by OLM packageserver
  - group: apiregistration.k8s.io
    kind: APIService
    jqPathExpressions:
    - .spec.caBundle
    - .metadata
    - .status
  # Job resources run once and complete
  - kind: Job
    jqPathExpressions:
    - .status
    - .metadata
    - .spec.selector
    - .spec.template.metadata

- name: redis-operator
  annotations:
    argocd.argoproj.io/sync-wave: '0'
  destinationNamespaceOverwrite: redis-operator
  syncOptions:
  - CreateNamespace=true
  - ServerSideApply=true
  - Replace=true

- name: clickhouse-operator
  annotations:
    argocd.argoproj.io/sync-wave: '0'
  destinationNamespaceOverwrite: clickhouse-operator
  syncOptions:
  - CreateNamespace=true
  - ServerSideApply=true
  - RespectIgnoreDifferences=true
  ignoreDifferences:
  # Kubernetes auto-populates apiVersion in fieldRef env vars, causing OutOfSync
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/template/spec/containers/0/env
    - /spec/template/spec/containers/1/env

commonLabels:
  platform.pnats.cloud/environment: 'production'
