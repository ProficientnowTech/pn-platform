# inventory/production/group_vars/app_server.yml - App Server Dev Dependencies
---
# Developer toolchain configuration for app servers
# Attach hosts to the "app_server" group in inventory to apply this.

dev_dependencies:
    packages:
        - git
        - build-essential
        - nginx
    docker:
        install: true
        add_users:
            - ansible
    nvm:
        install: true
        user: ansible
        version: v0.39.7
        node_version: lts/*
    pnpm:
        install: true
        version: 8.15.6
    certbot:
        install: true

# App deployment defaults (used by playbooks/app_services_deploy.yml)
app_deploy_source_mode: git
app_deploy_repo_url: git@github.com:ProficientnowTech/pnow-ats-v2.git
app_deploy_repo_version: develop
app_deploy_repo_key_path: /root/.ssh/github/id_rsa
# Store in Ansible Vault in practice:
# app_deploy_repo_ssh_key: |
#   -----BEGIN OPENSSH PRIVATE KEY-----
#   ...
#   -----END OPENSSH PRIVATE KEY-----

app_deploy_dest_path: /home/ansible/pnow-ats-v2
app_deploy_compose_files:
    - docker/docker-compose.yml
    - docker/pi-scrape.docker-compose.yml
    - apps/backend/audit-service/docker-compose.yml
    - apps/backend/tasks-reminders/docker-compose.yml
    - apps/backend/pi-boolgen/docker-compose.yml
    - apps/backend/pi-mailsum/docker-compose.yml
    - apps/backend/mailer/docker-compose.yml
    - apps/legacy/automation-service/docker-compose.yml
    - apps/legacy/dbt-pipelines/docker-compose.yml
    - apps/legacy/leads-gen-service/docker-compose.yml
    - apps/legacy/notify/docker-compose.yml
    - docker/dev.docker-compose.yml
    - docker/postgres.docker-compose.yml
    - docs/v2/dev-docs/docker-compose.yml
app_deploy_target_compose_files: []
app_deploy_env_src_local_path: ""
app_deploy_env_dest_relpath: ""
app_deploy_env_files:
    - src: /home/doxbox/pnow-ats-v2/docker/.env
      dest: docker/.env
      mode: "0600"
    - src: /home/doxbox/pnow-ats-v2/apps/backend/pi-scrape/.env
      dest: apps/backend/pi-scrape/.env
      mode: "0600"
    - src: /home/doxbox/pnow-ats-v2/apps/backend/audit-service/.env
      dest: apps/backend/audit-service/.env
      mode: "0600"
    - src: /home/doxbox/pnow-ats-v2/apps/backend/tasks-reminders/.env
      dest: apps/backend/tasks-reminders/.env
      mode: "0600"
    - src: /home/doxbox/pnow-ats-v2/apps/backend/pi-boolgen/.env
      dest: apps/backend/pi-boolgen/.env
      mode: "0600"
    - src: /home/doxbox/pnow-ats-v2/apps/backend/pi-mailsum/.env
      dest: apps/backend/pi-mailsum/.env
      mode: "0600"
      required: false
    - src: /home/doxbox/pnow-ats-v2/apps/backend/mailer/.env
      dest: apps/backend/mailer/.env
      mode: "0600"
      required: false
    - src: /home/doxbox/pnow-ats-v2/apps/legacy/automation-service/.env
      dest: apps/legacy/automation-service/.env
      mode: "0600"
      required: false
    - src: /home/doxbox/pnow-ats-v2/apps/legacy/dbt-pipelines/.env
      dest: apps/legacy/dbt-pipelines/.env
      mode: "0600"
      required: false
    - src: /home/doxbox/pnow-ats-v2/apps/legacy/leads-gen-service/.env
      dest: apps/legacy/leads-gen-service/.env
      mode: "0600"
      required: false
    - src: /home/doxbox/pnow-ats-v2/apps/legacy/notify/.env
      dest: apps/legacy/notify/.env
      mode: "0600"
      required: false
app_deploy_external_networks:
    - pnats_pnats-network
    - 2_pg_default
    - nocodb-leads_default
app_deploy_prereq_dirs:
    - /databases/meta
    - /databases/tenants
    - /databases/kafka-controller-1
    - /databases/kafka-controller-2
    - /databases/kafka-controller-3
    - /databases/kafka-broker-1
    - /databases/kafka-broker-2
    - /databases/kafka-broker-3
    - /databases/debezium
    - /databases/minio
    - /databases/redis
    - /databases/clickhouse
    - /databases/clickhouse_logs
    - /databases/automation
    - /databases/airflow-logs
    - /backups
# Alternative to file copy: store full docker/.env in vault
# app_deploy_env_content: |
#   ATS_DB_HOST=...

app_deploy_pull_images: false
app_deploy_sync_delete: false
app_deploy_manage_wireguard: true
app_deploy_require_wireguard: true
app_deploy_wireguard_interface: wg0
app_deploy_env_overrides: []
# Optional: limit deployment to a subset of services
# app_deploy_services:
#   - api-gateway
#   - frontend-web
#
# Optional: per-compose service filters
app_deploy_services_by_compose:
    docker/pi-scrape.docker-compose.yml:
        - api
#   docker/docker-compose.yml:
#       - api-gateway
#       - backend-main
#
# Optional: deploy only selected compose stacks (flag-style override)
# app_deploy_target_compose_files:
#   - docker/pi-scrape.docker-compose.yml
