---
# Dev Dependencies Playbook
# Installs developer toolchain for app servers
- name: Developer Dependencies Setup
  hosts: all
  become: true
  gather_facts: true
  vars:
      dev_dependencies_status: 'unknown'

  pre_tasks:
      - name: Check base role dependency if defined
        assert:
            that:
                - base_status is not defined or base_status == 'success'
            fail_msg: |
                Dev dependencies playbook requires successful base configuration when base_status is provided.
                Base status: {{ base_status | default('undefined') }}
            success_msg: 'Base dependency satisfied or not enforced'

      - name: Log dev dependencies playbook start
        debug:
            msg: |
                Starting dev dependencies playbook
                Base status: {{ base_status | default('not_executed') }}
                OS family: {{ ansible_os_family }}

  roles:
      - role: dev_dependencies
        when: dev_dependencies is defined

  post_tasks:
      - name: Set dev dependencies completion status
        set_fact:
            dev_dependencies_status: "{{ dev_dependencies_status | default('failed') }}"

      - name: Log dev dependencies playbook completion
        debug:
            msg: |
                Dev dependencies playbook completed
                Status: {{ dev_dependencies_status }}
                {% if dev_dependencies_status == 'success' %}
                ✓ Tools installed: {{ dev_deps_installed_tools | default([]) | join(', ') }}
                ✓ Success rate: {{ dev_deps_success_rate | default('unknown') }}%
                {% else %}
                ✗ Missing tools: {{ dev_deps_missing_tools | default([]) | join(', ') }}
                {% endif %}

      - name: Create dev dependencies status file
        copy:
            content: |
                # Dev dependencies playbook status
                timestamp: {{ ansible_date_time.iso8601 }}
                playbook: dev_dependencies.yml
                status: {{ dev_dependencies_status }}
                base_dependency: {{ base_status | default('not_executed') }}
                tools_installed: {{ dev_deps_installed_tools | default([]) | join(', ') }}
                success_rate: {{ dev_deps_success_rate | default('unknown') }}
            dest: /var/lib/ansible/playbook-dev-dependencies-status
            mode: '0644'
            owner: root
            group: root
        delegate_to: localhost
        run_once: true
