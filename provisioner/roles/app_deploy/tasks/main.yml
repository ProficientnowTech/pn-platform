---
- name: Validate deploy mode
  assert:
    that:
      - app_deploy_state in ['present', 'absent']
      - app_deploy_source_mode in ['git', 'local_sync']
      - app_deploy_compose_files is sequence
      - app_deploy_compose_files | length > 0
      - app_deploy_target_compose_files is sequence
      - app_deploy_env_files is sequence
    fail_msg: "Invalid app_deploy_* configuration."

- name: Normalize selector input
  set_fact:
    app_deploy_selectors_normalized: >-
      {{
        (
          app_deploy_selectors.split(',')
          if (app_deploy_selectors is string and app_deploy_selectors | length > 0)
          else app_deploy_selectors
        )
        | map('trim')
        | reject('equalto', '')
        | list
      }}
  when: app_deploy_selectors is defined

- name: Validate selectors are known
  assert:
    that:
      - item in app_deploy_selector_map
    fail_msg: "Unknown app_deploy selector '{{ item }}'. Add it to app_deploy_selector_map."
  loop: "{{ app_deploy_selectors_normalized | default([]) }}"
  when:
    - app_deploy_selectors_normalized is defined
    - app_deploy_selectors_normalized | length > 0

- name: Build compose/services from selectors
  set_fact:
    app_deploy_target_compose_files: "{{ (app_deploy_target_compose_files + [selector_cfg.compose]) | unique }}"
    app_deploy_services_by_compose: >-
      {{
        app_deploy_services_by_compose
        | combine(
            {
              selector_cfg.compose: (
                (app_deploy_services_by_compose[selector_cfg.compose] | default([]))
                + selector_cfg.services
              ) | unique
            },
            recursive=True
          )
      }}
  vars:
    selector_cfg: "{{ app_deploy_selector_map[item] }}"
  loop: "{{ app_deploy_selectors_normalized | default([]) }}"
  when:
    - app_deploy_selectors_normalized is defined
    - app_deploy_selectors_normalized | length > 0

- name: Resolve effective compose file list
  set_fact:
    app_deploy_effective_compose_files: >-
      {{
        app_deploy_target_compose_files
        if (app_deploy_target_compose_files | length > 0)
        else app_deploy_compose_files
      }}

- name: Decide if external network discovery from env files is needed
  set_fact:
    app_deploy_needs_external_network_discovery: >-
      {{
        (
          app_deploy_effective_compose_files
          | intersect(app_deploy_external_network_env_compose_files | default([]))
          | length
        ) > 0
      }}

- name: Validate requested compose files are configured
  assert:
    that:
      - app_deploy_effective_compose_files | difference(app_deploy_compose_files) | length == 0
    fail_msg: "app_deploy_target_compose_files contains entries not present in app_deploy_compose_files."
  when: app_deploy_target_compose_files | length > 0

- name: Verify source repository exists on controller
  delegate_to: localhost
  become: false
  stat:
    path: "{{ app_deploy_src_local_path }}"
  register: app_deploy_src_path
  when:
    - app_deploy_state == 'present'
    - app_deploy_source_mode == 'local_sync'

- name: Fail when source repository path is missing
  assert:
    that:
      - app_deploy_src_path.stat.exists
      - app_deploy_src_path.stat.isdir
    fail_msg: "Source repository not found: {{ app_deploy_src_local_path }}"
  when:
    - app_deploy_state == 'present'
    - app_deploy_source_mode == 'local_sync'

- name: Check docker availability
  command: docker --version
  register: app_deploy_docker_version
  changed_when: false
  when: app_deploy_state == 'present'

- name: Check docker compose availability
  command: docker compose version
  register: app_deploy_compose_version
  changed_when: false
  when: app_deploy_state == 'present'

- name: Require WireGuard interface for private-network deployment
  command: "ip -4 addr show {{ app_deploy_wireguard_interface }}"
  register: app_deploy_wireguard_check
  changed_when: false
  when:
    - app_deploy_state == 'present'
    - app_deploy_require_wireguard | bool

- name: Ensure deployment directory exists
  file:
    path: "{{ app_deploy_dest_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: app_deploy_state == 'present'

- name: Ensure SSH directory exists for private repo access
  file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: "0700"
  when:
    - app_deploy_state == 'present'
    - app_deploy_source_mode == 'git'

- name: Install GitHub deploy key
  copy:
    dest: "{{ app_deploy_repo_key_path }}"
    content: "{{ app_deploy_repo_ssh_key }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when:
    - app_deploy_state == 'present'
    - app_deploy_source_mode == 'git'
    - app_deploy_repo_ssh_key | default('') | length > 0

- name: Clone or update private repository
  git:
    repo: "{{ app_deploy_repo_url }}"
    dest: "{{ app_deploy_dest_path }}"
    version: "{{ app_deploy_repo_version }}"
    update: true
    accept_hostkey: true
    key_file: "{{ app_deploy_repo_key_path if app_deploy_repo_key_path | default('') | length > 0 else omit }}"
  when:
    - app_deploy_state == 'present'
    - app_deploy_source_mode == 'git'

- name: Sync local repository to target
  ansible.posix.synchronize:
    src: "{{ app_deploy_src_local_path }}/"
    dest: "{{ app_deploy_dest_path }}/"
    archive: true
    compress: true
    delete: "{{ app_deploy_sync_delete }}"
    rsync_opts: "{{ app_deploy_sync_excludes | map('regex_replace', '^(.*)$', '--exclude=\\1') | list }}"
  when:
    - app_deploy_state == 'present'
    - app_deploy_source_mode == 'local_sync'

- name: Ensure env file parent directory exists
  file:
    path: "{{ app_deploy_dest_path }}/{{ app_deploy_env_dest_relpath | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - app_deploy_state == 'present'
    - app_deploy_env_content | default('') | length > 0 or app_deploy_env_src_local_path | default('') | length > 0

- name: Ensure extra env file parent directories exist
  file:
    path: "{{ app_deploy_dest_path }}/{{ item.dest | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ app_deploy_env_files }}"
  when:
    - app_deploy_state == 'present'
    - app_deploy_env_files | length > 0

- name: Write environment file from inventory or vault content
  copy:
    dest: "{{ app_deploy_dest_path }}/{{ app_deploy_env_dest_relpath }}"
    content: "{{ app_deploy_env_content }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when:
    - app_deploy_state == 'present'
    - app_deploy_env_content | default('') | length > 0

- name: Sync environment file to target
  ansible.posix.synchronize:
    src: "{{ app_deploy_env_src_local_path }}"
    dest: "{{ app_deploy_dest_path }}/{{ app_deploy_env_dest_relpath }}"
    archive: false
    perms: true
  no_log: true
  when:
    - app_deploy_state == 'present'
    - app_deploy_env_content | default('') | length == 0
    - app_deploy_env_src_local_path | default('') | length > 0

- name: Set secure permissions on env file
  file:
    path: "{{ app_deploy_dest_path }}/{{ app_deploy_env_dest_relpath }}"
    owner: root
    group: root
    mode: "0600"
  when:
    - app_deploy_state == 'present'
    - app_deploy_env_content | default('') | length > 0 or app_deploy_env_src_local_path | default('') | length > 0

- name: Sync extra local environment files to target
  ansible.posix.synchronize:
    src: "{{ item.src }}"
    dest: "{{ app_deploy_dest_path }}/{{ item.dest }}"
    archive: false
    perms: true
  no_log: true
  loop: "{{ app_deploy_env_files }}"
  when:
    - app_deploy_state == 'present'
    - app_deploy_env_files | length > 0

- name: Set secure permissions on extra env files
  file:
    path: "{{ app_deploy_dest_path }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode | default('0600') }}"
  loop: "{{ app_deploy_env_files }}"
  when:
    - app_deploy_state == 'present'
    - app_deploy_env_files | length > 0

- name: Apply env overrides into target env files
  lineinfile:
    path: "{{ app_deploy_dest_path }}/{{ item.file }}"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    create: true
    owner: root
    group: root
    mode: "0600"
  no_log: true
  loop: "{{ app_deploy_env_overrides }}"
  when:
    - app_deploy_state == 'present'
    - app_deploy_env_overrides | length > 0

- name: Discover DOCKER_NETWORK_NAME values from env files
  shell: "awk -F= '/^DOCKER_NETWORK_NAME=/{print $2}' {{ app_deploy_dest_path }}/{{ item.dest }} | tail -n 1"
  register: app_deploy_network_name_discovery
  changed_when: false
  failed_when: false
  loop: "{{ app_deploy_env_files }}"
  when:
    - app_deploy_state == 'present'
    - app_deploy_env_files | length > 0
    - app_deploy_needs_external_network_discovery | bool

- name: Build effective external Docker network list
  set_fact:
    app_deploy_effective_external_networks: >-
      {{
        (
          app_deploy_external_networks +
          (
            app_deploy_network_name_discovery.results
            | default([])
            | selectattr('stdout', 'defined')
            | map(attribute='stdout')
            | map('trim')
            | reject('equalto', '')
            | list
          )
        ) | unique
      }}
  when: app_deploy_state == 'present'

- name: Ensure required external Docker networks exist
  shell: >
    docker network inspect {{ item }} >/dev/null 2>&1
    || (docker network create {{ item }} && echo created)
  register: app_deploy_network_create_result
  changed_when: "'created' in app_deploy_network_create_result.stdout"
  loop: "{{ app_deploy_effective_external_networks | default([]) }}"
  when:
    - app_deploy_state == 'present'
    - app_deploy_effective_external_networks | default([]) | length > 0

- name: Pull container images
  command: "docker compose -f {{ item | basename }} pull"
  args:
    chdir: "{{ app_deploy_dest_path }}/{{ item | dirname }}"
  register: app_deploy_pull_result
  changed_when: >-
    ('Downloaded' in app_deploy_pull_result.stdout) or
    ('Pull complete' in app_deploy_pull_result.stdout)
  loop: "{{ app_deploy_effective_compose_files }}"
  when:
    - app_deploy_state == 'present'
    - app_deploy_pull_images | bool

- name: Start or update services
  command: >-
    docker compose -f {{ item | basename }} up -d --build
    {{
      (
        app_deploy_services_by_compose[item]
        if (app_deploy_services_by_compose is mapping and item in app_deploy_services_by_compose)
        else app_deploy_services
      ) | join(' ')
    }}
  args:
    chdir: "{{ app_deploy_dest_path }}/{{ item | dirname }}"
  register: app_deploy_up_result
  changed_when: >-
    ('Creating ' in app_deploy_up_result.stdout) or
    ('Recreating ' in app_deploy_up_result.stdout) or
    ('Starting ' in app_deploy_up_result.stdout) or
    ('Building ' in app_deploy_up_result.stdout)
  loop: "{{ app_deploy_effective_compose_files }}"
  when: app_deploy_state == 'present'

- name: Show running services
  command: "docker compose -f {{ item | basename }} ps"
  args:
    chdir: "{{ app_deploy_dest_path }}/{{ item | dirname }}"
  register: app_deploy_ps_result
  changed_when: false
  loop: "{{ app_deploy_effective_compose_files }}"
  when: app_deploy_state == 'present'

- name: Stop services
  command: "docker compose -f {{ item | basename }} down"
  args:
    chdir: "{{ app_deploy_dest_path }}/{{ item | dirname }}"
  register: app_deploy_down_result
  changed_when: >-
    ('Stopping ' in app_deploy_down_result.stdout) or
    ('Removing ' in app_deploy_down_result.stdout) or
    ('Network ' in app_deploy_down_result.stdout)
  loop: "{{ app_deploy_effective_compose_files }}"
  when: app_deploy_state == 'absent'
