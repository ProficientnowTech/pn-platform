---
- name: Check if Docker is already installed
  command: docker --version
  register: docker_version_check
  changed_when: false
  failed_when: false
  when: dev_deps_docker.install | default(false)

- name: Set Docker architecture mapping
  set_fact:
      docker_arch: >-
          {{
            {
              'x86_64': 'amd64',
              'aarch64': 'arm64',
              'armv7l': 'armhf'
            }.get(ansible_architecture, ansible_architecture)
          }}
  when:
      - dev_deps_docker.install | default(false)
      - docker_version_check.rc != 0

- name: Ensure Docker repository prerequisites (Debian)
  apt:
      name:
          - ca-certificates
          - curl
      state: present
  when:
      - dev_deps_docker.install | default(false)
      - docker_version_check.rc != 0

- name: Ensure Docker keyrings directory
  file:
      path: /etc/apt/keyrings
      state: directory
      mode: '0755'
  when:
      - dev_deps_docker.install | default(false)
      - docker_version_check.rc != 0

- name: Add Docker GPG key
  get_url:
      url: https://download.docker.com/linux/ubuntu/gpg
      dest: /etc/apt/keyrings/docker.asc
      mode: '0644'
      force: true
  when:
      - dev_deps_docker.install | default(false)
      - docker_version_check.rc != 0

- name: Add Docker apt sources file
  copy:
      content: |
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: {{ ansible_distribution_release }}
          Components: stable
          Signed-By: /etc/apt/keyrings/docker.asc
      dest: /etc/apt/sources.list.d/docker.sources
      mode: '0644'
  when:
      - dev_deps_docker.install | default(false)
      - docker_version_check.rc != 0

- name: Update apt cache after adding Docker repository
  apt:
      update_cache: yes
  when:
      - dev_deps_docker.install | default(false)
      - docker_version_check.rc != 0

- name: Install Docker packages
  apt:
      name: '{{ dev_deps_docker.packages | default(["docker-ce", "docker-ce-cli", "containerd.io", "docker-buildx-plugin", "docker-compose-plugin"]) }}'
      state: present
  when:
      - dev_deps_docker.install | default(false)
      - docker_version_check.rc != 0
  register: docker_install_result

- name: Ensure Docker service is enabled and running
  service:
      name: docker
      state: started
      enabled: true
  when: dev_deps_docker.install | default(false)

- name: Ensure docker group exists
  group:
      name: docker
      state: present
  when: dev_deps_docker.install | default(false)

- name: Add users to docker group
  user:
      name: '{{ item }}'
      groups: docker
      append: true
  loop: '{{ dev_deps_docker.add_users | default([]) }}'
  when:
      - dev_deps_docker.install | default(false)
      - dev_deps_docker.add_users is defined
      - dev_deps_docker.add_users | length > 0
