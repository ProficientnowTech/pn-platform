---
- name: Install WireGuard
  apt:
    name: wireguard
    state: present
    update_cache: true

- name: Ensure /etc/wireguard exists
  file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Check existing WireGuard private key
  stat:
    path: /etc/wireguard/privatekey
  register: wg_private_key_stat

- name: Generate WireGuard private key
  command: wg genkey
  register: wg_private_key_gen
  changed_when: true
  when: not wg_private_key_stat.stat.exists

- name: Write WireGuard private key
  copy:
    content: "{{ wg_private_key_gen.stdout }}"
    dest: /etc/wireguard/privatekey
    owner: root
    group: root
    mode: '0600'
  when: not wg_private_key_stat.stat.exists

- name: Read WireGuard private key
  slurp:
    src: /etc/wireguard/privatekey
  register: wg_private_key_slurp

- name: Set private key fact
  set_fact:
    wireguard_private_key: "{{ wg_private_key_slurp.content | b64decode | trim }}"

- name: Check existing WireGuard public key
  stat:
    path: /etc/wireguard/publickey
  register: wg_public_key_stat

- name: Generate WireGuard public key
  command: /bin/sh -c "cat /etc/wireguard/privatekey | wg pubkey"
  register: wg_public_key_gen
  changed_when: true
  when: not wg_public_key_stat.stat.exists

- name: Write WireGuard public key
  copy:
    content: "{{ wg_public_key_gen.stdout }}"
    dest: /etc/wireguard/publickey
    owner: root
    group: root
    mode: '0644'
  when: not wg_public_key_stat.stat.exists

- name: Read WireGuard public key
  slurp:
    src: /etc/wireguard/publickey
  register: wg_public_key_slurp

- name: Set public key fact
  set_fact:
    wireguard_public_key: "{{ wg_public_key_slurp.content | b64decode | trim }}"

- name: Ensure all hosts define wireguard_address
  assert:
    that:
      - wireguard_address is defined
    fail_msg: "wireguard_address must be set in inventory for each host."

- name: Collect public keys from all hosts
  slurp:
    src: /etc/wireguard/publickey
  delegate_to: "{{ item }}"
  register: wg_pubkeys
  loop: "{{ groups['app_server'] | list }}"
  run_once: true

- name: Build public key map
  set_fact:
    wireguard_pubkey_map: "{{ dict(wg_pubkeys.results | map(attribute='item') | zip(wg_pubkeys.results | map(attribute='content') | map('b64decode') | map('trim'))) }}"
  run_once: true
  delegate_to: localhost

- name: Distribute public key map
  set_fact:
    wireguard_pubkey_map: "{{ hostvars['localhost'].wireguard_pubkey_map }}"
  when: hostvars['localhost'].wireguard_pubkey_map is defined

- name: Build peers list
  set_fact:
    wireguard_peers: []

- name: Append peers
  set_fact:
    wireguard_peers: "{{ wireguard_peers + [ {\n      'address': hostvars[item].wireguard_address,\n      'endpoint': hostvars[item].ansible_host,\n      'public_key': wireguard_pubkey_map[item]\n    } ] }}"
  loop: "{{ groups['app_server'] | reject('equalto', inventory_hostname) | list }}"

- name: Render wg0.conf
  template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: '0600'

- name: Enable IP forwarding (optional, default off)
  sysctl:
    name: net.ipv4.ip_forward
    value: "{{ wireguard_ip_forward | ternary(1, 0) }}"
    state: present
    reload: true

- name: Ensure UFW is installed
  apt:
    name: ufw
    state: present
    update_cache: false

- name: Configure UFW defaults
  ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Allow outgoing by default
  ufw:
    policy: allow
    direction: outgoing

- name: Allow SSH
  ufw:
    rule: allow
    port: '22'
    proto: tcp

- name: Allow WireGuard UDP
  ufw:
    rule: allow
    port: "{{ wireguard_listen_port }}"
    proto: udp

- name: Allow all inbound on wg0
  ufw:
    rule: allow
    direction: in
    interface: "{{ wireguard_interface }}"

- name: Enable and start WireGuard
  systemd:
    name: "wg-quick@{{ wireguard_interface }}"
    enabled: true
    state: started
